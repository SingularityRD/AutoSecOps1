# Lint and render fixture: external services, every optional feature on.
urls:
  publicApp: https://autosecops.example.com
secrets:
  existingSecret: autosecops-core
  keys:
    licenseKey: licenseKey
autosecops:
  auth:
    allowedDomains: example.com
    superadminEmail: admin@example.com
externalPostgres:
  host: postgres.example.internal
  database: autosecops
  sslMode: verify-full
  auth:
    existingSecret: autosecops-postgres
externalRedis:
  auth:
    existingSecret: autosecops-redis
externalS3:
  region: us-east-1
externalTemporal:
  clusterUrl: temporal-frontend.temporal.svc:7233
  auth:
    existingSecret: autosecops-temporal
ingress:
  enabled: true
  className: nginx
  host: autosecops.example.com
  tls:
    - hosts: [autosecops.example.com]
      secretName: autosecops-tls
api:
  autoscaling:
    enabled: true
executor:
  backend: nsjail
networkPolicy:
  caddyIngressFrom:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: ingress-nginx
