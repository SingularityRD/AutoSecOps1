{{- if .Values.ingress.enabled }}
{{- $api := include "autosecops.componentName" (dict "root" . "component" "api") -}}
{{- $mcp := include "autosecops.componentName" (dict "root" . "component" "mcp") -}}
{{- $ui := include "autosecops.componentName" (dict "root" . "component" "ui") -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "autosecops.fullname" . }}
  labels:
    {{- include "autosecops.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          {{- if .Values.api.enabled }}
          # FastAPI serves under the /api root path, so the prefix is kept.
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ $api }}
                port:
                  name: http
          {{- end }}
          {{- if .Values.mcp.enabled }}
          # MCP endpoint plus the OAuth and discovery routes FastMCP serves at
          # the root, as in the Docker Compose Caddyfile.
          {{- range $path := list "/mcp" "/.well-known/oauth-protected-resource" "/authorize" "/consent" "/auth/callback" }}
          - path: {{ $path }}
            pathType: Prefix
            backend:
              service:
                name: {{ $mcp }}
                port:
                  name: http
          {{- end }}
          {{- range $path := list "/.well-known/oauth-authorization-server" "/token" "/register" }}
          - path: {{ $path }}
            pathType: Exact
            backend:
              service:
                name: {{ $mcp }}
                port:
                  name: http
          {{- end }}
          {{- end }}
          {{- if .Values.ui.enabled }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $ui }}
                port:
                  name: http
          {{- end }}
{{- end }}
