{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccount.name | default (include "autosecops.fullname" .) }}
  labels:
    {{- include "autosecops.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# Pods opt in to a token only when they call the Kubernetes API (the API
# service with tunnels enabled).
automountServiceAccountToken: false
{{- end }}
