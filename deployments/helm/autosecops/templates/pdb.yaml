{{- $root := . }}
{{- $components := dict "api" "api" "worker" "worker" "executor" "executor" "agentWorker" "agent-worker" "agentExecutor" "agent-executor" "mcp" "mcp" "litellm" "litellm" "ui" "ui" "caddy" "caddy" }}
{{- range $key, $component := $components }}
{{- $values := index $root.Values $key }}
{{- $enabled := ne (toString (dig "enabled" true $values)) "false" }}
{{- $replicas := ternary $values.autoscaling.minReplicas $values.replicaCount $values.autoscaling.enabled }}
{{- /* A PDB on a single replica would block node drains. */}}
{{- if and $enabled $values.pdb.enabled (gt (int $replicas) 1) }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "autosecops.componentFullname" (dict "root" $root "component" $component) }}
  labels:
    {{- include "autosecops.labels" $root | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
spec:
  maxUnavailable: {{ $values.pdb.maxUnavailable }}
  selector:
    matchLabels:
      {{- include "autosecops.selectorLabels" (dict "root" $root "component" $component) | nindent 6 }}
{{- end }}
{{- end }}
