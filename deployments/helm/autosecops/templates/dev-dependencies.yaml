{{- if .Values.devDependencies.enabled }}
{{- /*
DEVELOPMENT ONLY: single-replica stateful dependencies for evaluation
clusters. Production installs use external PostgreSQL, Redis, S3, and Temporal.
*/}}
{{- $root := . }}
{{- $dev := .Values.devDependencies }}
{{- $pg := .Values.externalPostgres }}
{{- $s3 := .Values.externalS3 }}
{{- $pgName := include "autosecops.componentFullname" (dict "root" . "component" "postgres") }}
{{- $pgUser := dict "name" "POSTGRES_USER" "secret" $pg.auth.existingSecret "key" $pg.auth.usernameKey }}
{{- $pgPass := dict "name" "POSTGRES_PASSWORD" "secret" $pg.auth.existingSecret "key" $pg.auth.passwordKey }}
{{- $services := list
  (dict "component" "postgres" "port" 5432 "image" $dev.postgres.image "storage" $dev.postgres.storage "mountPath" "/var/lib/postgresql/data" "uid" 999)
  (dict "component" "redis" "port" 6379 "image" $dev.redis.image "storage" $dev.redis.storage "mountPath" "/data" "uid" 999)
  (dict "component" "minio" "port" 9000 "image" $dev.minio.image "storage" $dev.minio.storage "mountPath" "/data" "uid" 65532)
}}
{{- range $services }}
{{- $name := include "autosecops.componentFullname" (dict "root" $root "component" .component) }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "autosecops.labels" $root | nindent 4 }}
    app.kubernetes.io/component: {{ .component }}
spec:
  type: ClusterIP
  selector:
    {{- include "autosecops.selectorLabels" (dict "root" $root "component" .component) | nindent 4 }}
  ports:
    - name: tcp
      port: {{ .port }}
      targetPort: tcp
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $name }}
  labels:
    {{- include "autosecops.labels" $root | nindent 4 }}
    app.kubernetes.io/component: {{ .component }}
spec:
  serviceName: {{ $name }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "autosecops.selectorLabels" (dict "root" $root "component" .component) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "autosecops.selectorLabels" (dict "root" $root "component" .component) | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      {{- with $root.Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: {{ .uid }}
        runAsGroup: {{ .uid }}
        fsGroup: {{ .uid }}
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: {{ .component }}
          image: {{ .image }}
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - name: tcp
              containerPort: {{ .port }}
          {{- if eq .component "postgres" }}
          env:
            {{- include "autosecops.secretEnv" $pgUser | nindent 12 }}
            {{- include "autosecops.secretEnv" $pgPass | nindent 12 }}
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -h 127.0.0.1 -U \"$POSTGRES_USER\" -d postgres"]
            periodSeconds: 5
          {{- else if eq .component "redis" }}
          args: ["redis-server", "--appendonly", "yes"]
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 5
          {{- else if eq .component "minio" }}
          args: ["server", "/data", "--console-address", ":9001"]
          env:
            {{- include "autosecops.secretEnv" (dict "name" "MINIO_ROOT_USER" "secret" $s3.auth.existingSecret "key" $s3.auth.accessKeyIdKey) | nindent 12 }}
            {{- include "autosecops.secretEnv" (dict "name" "MINIO_ROOT_PASSWORD" "secret" $s3.auth.existingSecret "key" $s3.auth.secretAccessKeyKey) | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: tcp
            periodSeconds: 5
          {{- end }}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 1Gi}
          volumeMounts:
            - name: data
              mountPath: {{ .mountPath }}
            - name: tmp
              mountPath: /tmp
            {{- if eq .component "postgres" }}
            - name: run
              mountPath: /var/run/postgresql
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        - name: run
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with $dev.storageClassName }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .storage }}
{{- end }}
{{- $temporalName := include "autosecops.componentFullname" (dict "root" . "component" "temporal") }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $temporalName }}
  labels:
    {{- include "autosecops.labels" . | nindent 4 }}
    app.kubernetes.io/component: temporal
spec:
  type: ClusterIP
  selector:
    {{- include "autosecops.selectorLabels" (dict "root" . "component" "temporal") | nindent 4 }}
  ports:
    - name: grpc
      port: 7233
      targetPort: grpc
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $temporalName }}
  labels:
    {{- include "autosecops.labels" . | nindent 4 }}
    app.kubernetes.io/component: temporal
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "autosecops.selectorLabels" (dict "root" . "component" "temporal") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "autosecops.selectorLabels" (dict "root" . "component" "temporal") | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: temporal
          image: {{ $dev.temporal.image }}
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - name: grpc
              containerPort: 7233
          env:
            - name: DB
              value: postgres12
            - name: DB_PORT
              value: "5432"
            - name: POSTGRES_SEEDS
              value: {{ $pgName }}
            {{- include "autosecops.secretEnv" $pgUser | nindent 12 }}
            {{- include "autosecops.secretEnv" (dict "name" "POSTGRES_PWD" "secret" $pg.auth.existingSecret "key" $pg.auth.passwordKey) | nindent 12 }}
            - name: DEFAULT_NAMESPACE_RETENTION
              value: {{ $dev.temporal.defaultNamespaceRetention | quote }}
            - name: LOG_LEVEL
              value: warn
            - name: BIND_ON_IP
              value: 0.0.0.0
            - name: TEMPORAL_BROADCAST_ADDRESS
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          readinessProbe:
            tcpSocket:
              port: grpc
            periodSeconds: 5
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {cpu: "2", memory: 2Gi}
{{- end }}
