{{- if .Values.networkPolicy.enabled }}
{{- $root := . }}
{{- $release := dict "app.kubernetes.io/name" (include "autosecops.name" .) "app.kubernetes.io/instance" .Release.Name }}
{{- /*
Ingress policy per component. Egress stays open: workflows and agents call
integrations and model endpoints that operators choose.
peers: "any" (all sources), "caddy", "release" (every pod of this release),
or "none" (no inbound traffic).
*/}}
{{- $policies := list
  (dict "component" "caddy" "port" 8080 "peers" "any" "enabled" .Values.caddy.enabled)
  (dict "component" "ui" "port" 3000 "peers" "caddy" "enabled" true)
  (dict "component" "api" "port" 8000 "peers" "release" "enabled" true)
  (dict "component" "mcp" "port" 8099 "peers" "release" "enabled" .Values.mcp.enabled)
  (dict "component" "litellm" "port" 4000 "peers" "release" "enabled" .Values.litellm.enabled)
  (dict "component" "worker" "port" 0 "peers" "none" "enabled" true)
  (dict "component" "executor" "port" 0 "peers" "none" "enabled" true)
  (dict "component" "agent-worker" "port" 0 "peers" "none" "enabled" true)
  (dict "component" "agent-executor" "port" 0 "peers" "none" "enabled" true)
  (dict "component" "migrations" "port" 0 "peers" "none" "enabled" .Values.migrations.enabled)
  (dict "component" "postgres" "port" 5432 "peers" "release" "enabled" .Values.devDependencies.enabled)
  (dict "component" "redis" "port" 6379 "peers" "release" "enabled" .Values.devDependencies.enabled)
  (dict "component" "minio" "port" 9000 "peers" "release" "enabled" .Values.devDependencies.enabled)
  (dict "component" "temporal" "port" 7233 "peers" "release" "enabled" .Values.devDependencies.enabled)
}}
{{- range $policies }}
{{- if .enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "autosecops.componentFullname" (dict "root" $root "component" .component) }}
  labels:
    {{- include "autosecops.labels" $root | nindent 4 }}
    app.kubernetes.io/component: {{ .component }}
spec:
  podSelector:
    matchLabels:
      {{- include "autosecops.selectorLabels" (dict "root" $root "component" .component) | nindent 6 }}
  policyTypes: ["Ingress"]
  {{- if eq .peers "none" }}
  ingress: []
  {{- else }}
  ingress:
    - ports:
        - port: {{ .port }}
          protocol: TCP
      {{- if eq .peers "any" }}
      {{- with $root.Values.networkPolicy.caddyIngressFrom }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- else if eq .peers "caddy" }}
      from:
        - podSelector:
            matchLabels:
              {{- include "autosecops.selectorLabels" (dict "root" $root "component" "caddy") | nindent 14 }}
      {{- else }}
      from:
        - podSelector:
            matchLabels:
              {{- toYaml $release | nindent 14 }}
      {{- end }}
  {{- end }}
{{- end }}
{{- end }}
{{- end }}
