{{- $root := . }}
{{- $components := dict "api" "api" "worker" "worker" "executor" "executor" "agentWorker" "agent-worker" "agentExecutor" "agent-executor" "mcp" "mcp" "litellm" "litellm" "ui" "ui" "caddy" "caddy" }}
{{- range $key, $component := $components }}
{{- $values := index $root.Values $key }}
{{- $enabled := ne (toString (dig "enabled" true $values)) "false" }}
{{- if and $enabled $values.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "autosecops.componentFullname" (dict "root" $root "component" $component) }}
  labels:
    {{- include "autosecops.labels" $root | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "autosecops.componentFullname" (dict "root" $root "component" $component) }}
  minReplicas: {{ $values.autoscaling.minReplicas }}
  maxReplicas: {{ $values.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ $values.autoscaling.targetCPUUtilizationPercentage }}
{{- end }}
{{- end }}
