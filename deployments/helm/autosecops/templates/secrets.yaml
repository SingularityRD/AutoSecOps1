{{- /*
Chart-managed Secrets, created only when no existingSecret is referenced.
With migrations as Helm hooks, the Secrets are hooks too so they exist before
the migrations Job runs. Helm does not delete hook resources on uninstall, so
the generated keys survive `helm uninstall`; delete them by hand when you mean
to discard the installation.
*/ -}}
{{- define "autosecops.secretHookAnnotations" -}}
{{- if and .Values.migrations.enabled .Values.migrations.useHelmHooks }}
annotations:
  helm.sh/hook: pre-install,pre-upgrade
  helm.sh/hook-weight: "-10"
  helm.sh/hook-delete-policy: before-hook-creation
{{- end }}
{{- end -}}
{{- $s := .Values.secrets -}}
{{- if not $s.existingSecret }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "autosecops.coreSecretName" . }}
  labels:
    {{- include "autosecops.labels" . | nindent 4 }}
  {{- include "autosecops.secretHookAnnotations" . | nindent 2 }}
type: Opaque
stringData:
  {{- range $key := list "dbEncryptionKey" "serviceKey" "signingSecret" "userAuthSecret" "licenseKey" "oidcClientId" "oidcClientSecret" "oauthClientId" "oauthClientSecret" "samlIdpMetadataUrl" "smtpPassword" "sentryDsn" "outboundProxyUrl" "otelExporterOtlpHeaders" "temporalPayloadEncryptionKeyring" }}
  {{- with index $s $key }}
  {{ $key }}: {{ . | toString | quote }}
  {{- end }}
  {{- end }}
{{- end }}
{{- with .Values.externalPostgres.auth }}
{{- if not .existingSecret }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "autosecops.postgresSecretName" $ }}
  labels:
    {{- include "autosecops.labels" $ | nindent 4 }}
  {{- include "autosecops.secretHookAnnotations" $ | nindent 2 }}
type: Opaque
stringData:
  {{ .usernameKey }}: {{ .username | toString | quote }}
  {{ .passwordKey }}: {{ .password | toString | quote }}
{{- end }}
{{- end }}
{{- with .Values.externalRedis.auth }}
{{- if not .existingSecret }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "autosecops.redisSecretName" $ }}
  labels:
    {{- include "autosecops.labels" $ | nindent 4 }}
  {{- include "autosecops.secretHookAnnotations" $ | nindent 2 }}
type: Opaque
stringData:
  {{ .urlKey }}: {{ .url | toString | quote }}
{{- end }}
{{- end }}
{{- with .Values.externalS3.auth }}
{{- if and (not .existingSecret) .accessKeyId }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "autosecops.s3SecretName" $ }}
  labels:
    {{- include "autosecops.labels" $ | nindent 4 }}
  {{- include "autosecops.secretHookAnnotations" $ | nindent 2 }}
type: Opaque
stringData:
  {{ .accessKeyIdKey }}: {{ .accessKeyId | toString | quote }}
  {{ .secretAccessKeyKey }}: {{ .secretAccessKey | toString | quote }}
{{- end }}
{{- end }}
{{- with .Values.externalTemporal.auth }}
{{- if and (not .existingSecret) .apiKey }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "autosecops.temporalSecretName" $ }}
  labels:
    {{- include "autosecops.labels" $ | nindent 4 }}
  {{- include "autosecops.secretHookAnnotations" $ | nindent 2 }}
type: Opaque
stringData:
  {{ .apiKeyKey }}: {{ .apiKey | toString | quote }}
{{- end }}
{{- end }}
{{- with .Values.autosecops.pangolin }}
{{- if and (not .existingSecret) .apiKey }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "autosecops.pangolinSecretName" $ }}
  labels:
    {{- include "autosecops.labels" $ | nindent 4 }}
type: Opaque
stringData:
  {{ .apiKeyKey }}: {{ .apiKey | toString | quote }}
{{- end }}
{{- end }}
