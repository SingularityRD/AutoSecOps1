{{- if .Values.caddy.enabled }}
{{- $name := include "autosecops.componentFullname" (dict "root" . "component" "caddy") }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}
  labels:
    {{- include "autosecops.labels" . | nindent 4 }}
    app.kubernetes.io/component: caddy
data:
  Caddyfile: |
    {{- include "autosecops.caddyfile" . | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "autosecops.labels" . | nindent 4 }}
    app.kubernetes.io/component: caddy
spec:
  {{- if not .Values.caddy.autoscaling.enabled }}
  replicas: {{ .Values.caddy.replicaCount }}
  {{- end }}
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      {{- include "autosecops.selectorLabels" (dict "root" . "component" "caddy") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "autosecops.selectorLabels" (dict "root" . "component" "caddy") | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        checksum/caddyfile: {{ include "autosecops.caddyfile" . | sha256sum | trunc 16 }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "autosecops.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
      enableServiceLinks: false
      {{- include "autosecops.podScheduling" . | nindent 6 }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: caddy
          image: "{{ .Values.caddy.image.repository }}:{{ .Values.caddy.image.tag }}"
          imagePullPolicy: {{ .Values.caddy.image.pullPolicy }}
          args: ["caddy", "run", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile"]
          securityContext:
            {{- toYaml (mergeOverwrite (deepCopy .Values.containerSecurityContext) .Values.caddy.containerSecurityContext) | nindent 12 }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          livenessProbe:
            tcpSocket: {port: http}
            periodSeconds: 15
          readinessProbe:
            tcpSocket: {port: http}
            periodSeconds: 10
          resources:
            {{- toYaml .Values.caddy.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/caddy
              readOnly: true
            - name: data
              mountPath: /data
            - name: xdg-config
              mountPath: /config
      volumes:
        - name: config
          configMap:
            name: {{ $name }}
        - name: data
          emptyDir: {}
        - name: xdg-config
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "autosecops.labels" . | nindent 4 }}
    app.kubernetes.io/component: caddy
spec:
  type: {{ .Values.caddy.service.type }}
  selector:
    {{- include "autosecops.selectorLabels" (dict "root" . "component" "caddy") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.caddy.service.port }}
      targetPort: http
      protocol: TCP
{{- end }}
