{{- if .Values.migrations.enabled }}
{{- $hook := and .Values.migrations.hook (not .Values.devDependencies.enabled) }}
apiVersion: batch/v1
kind: Job
metadata:
  {{- if $hook }}
  name: {{ include "autosecops.componentFullname" (dict "root" . "component" "migrations") }}
  {{- else }}
  # Not a hook: the bundled database starts with the release. A new name per
  # revision lets each upgrade run migrations once.
  name: {{ printf "%s-%d" (include "autosecops.componentFullname" (dict "root" . "component" "migrations")) .Release.Revision }}
  {{- end }}
  labels:
    {{- include "autosecops.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrations
  {{- if $hook }}
  annotations:
    # Hooks run before chart-managed objects exist, so this Job uses only
    # operator-provided Secrets and inline settings.
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation
  {{- end }}
spec:
  backoffLimit: {{ .Values.migrations.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.migrations.activeDeadlineSeconds }}
  ttlSecondsAfterFinished: {{ .Values.migrations.ttlSecondsAfterFinished }}
  template:
    metadata:
      labels:
        {{- include "autosecops.selectorLabels" (dict "root" . "component" "migrations") | nindent 8 }}
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      enableServiceLinks: false
      {{- include "autosecops.podScheduling" . | nindent 6 }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: migrations
          image: {{ include "autosecops.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["python3", "-m", "alembic", "upgrade", "head"]
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          env:
            - name: LOG_LEVEL
              value: {{ .Values.autosecops.logLevel | quote }}
            - name: TRACECAT__LOG_FORMAT
              value: {{ .Values.autosecops.logFormat | quote }}
            - name: TRACECAT__FEATURE_FLAGS
              value: {{ .Values.autosecops.featureFlags | quote }}
            {{- if .Values.secrets.keys.licenseKey }}
            {{- include "autosecops.secretEnv" (dict "name" "TRACECAT__LICENSE_KEY" "secret" .Values.secrets.existingSecret "key" .Values.secrets.keys.licenseKey) | nindent 12 }}
            {{- end }}
            {{- include "autosecops.dbEnv" . | nindent 12 }}
          resources:
            {{- toYaml .Values.migrations.resources | nindent 12 }}
          volumeMounts:
            {{- include "autosecops.backendScratchMounts" . | nindent 12 }}
      volumes:
        {{- include "autosecops.backendScratchVolumes" . | nindent 8 }}
{{- end }}
