{{- include "autosecops.validate" . }}
{{- $root := . }}
{{- $components := include "autosecops.backendComponents" . | fromYaml }}
{{- range $key := list "api" "worker" "executor" "agentWorker" "agentExecutor" "mcp" "litellm" }}
{{- $values := index $root.Values $key }}
{{- $meta := index $components $key }}
{{- if (ne (toString (dig "enabled" true $values)) "false") }}
{{- $name := include "autosecops.componentFullname" (dict "root" $root "component" $meta.component) }}
{{- $sandboxed := eq (toString (dig "backend" "direct" $values)) "nsjail" }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "autosecops.labels" $root | nindent 4 }}
    app.kubernetes.io/component: {{ $meta.component }}
spec:
  {{- if not $values.autoscaling.enabled }}
  replicas: {{ $values.replicaCount }}
  {{- end }}
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      {{- include "autosecops.selectorLabels" (dict "root" $root "component" $meta.component) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "autosecops.selectorLabels" (dict "root" $root "component" $meta.component) | nindent 8 }}
        {{- with $root.Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with $root.Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "autosecops.serviceAccountName" $root }}
      automountServiceAccountToken: {{ $root.Values.serviceAccount.automountServiceAccountToken }}
      # Service links inject variables such as <NAME>_PORT that collide with
      # application settings.
      enableServiceLinks: false
      {{- include "autosecops.podScheduling" $root | nindent 6 }}
      {{- if $sandboxed }}
      # nsjail needs root, SYS_ADMIN, an unconfined seccomp profile, and
      # /dev/net/tun; the sandbox bootstrap drops to the service user.
      securityContext:
        runAsNonRoot: false
        runAsUser: 0
        runAsGroup: 0
        fsGroup: 1001
      {{- else }}
      securityContext:
        {{- toYaml $root.Values.podSecurityContext | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ $meta.component }}
          image: {{ include "autosecops.image" $root }}
          imagePullPolicy: {{ $root.Values.image.pullPolicy }}
          {{- if and $sandboxed $meta.sandboxEntrypoint }}
          command:
            {{- toYaml $meta.sandboxEntrypoint | nindent 12 }}
          args:
            {{- toYaml $meta.command | nindent 12 }}
          {{- else if $meta.command }}
          command:
            {{- toYaml $meta.command | nindent 12 }}
          {{- end }}
          {{- if $sandboxed }}
          securityContext:
            privileged: true
            allowPrivilegeEscalation: true
            readOnlyRootFilesystem: false
            capabilities:
              add: ["SYS_ADMIN"]
            seccompProfile:
              type: Unconfined
            appArmorProfile:
              type: Unconfined
          {{- else }}
          securityContext:
            {{- toYaml (mergeOverwrite (deepCopy $root.Values.containerSecurityContext) $values.containerSecurityContext) | nindent 12 }}
          {{- end }}
          {{- if $meta.port }}
          ports:
            - name: http
              containerPort: {{ $meta.port }}
              protocol: TCP
          {{- end }}
          env:
            {{- include "autosecops.backendEnv" (dict "root" $root "key" $key "meta" $meta) | nindent 12 }}
          {{- with $values.startupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml $values.resources | nindent 12 }}
          volumeMounts:
            {{- include "autosecops.backendScratchMounts" $root | nindent 12 }}
      volumes:
        {{- include "autosecops.backendScratchVolumes" $root | nindent 8 }}
{{- if $meta.port }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "autosecops.labels" $root | nindent 4 }}
    app.kubernetes.io/component: {{ $meta.component }}
spec:
  type: ClusterIP
  selector:
    {{- include "autosecops.selectorLabels" (dict "root" $root "component" $meta.component) | nindent 4 }}
  ports:
    - name: http
      port: {{ $meta.port }}
      targetPort: http
      protocol: TCP
{{- end }}
{{- end }}
{{- end }}
