      start_period: 10s

  agent-executor:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    restart: unless-stopped

    # Container-level fork-bomb bound: in-jail RLIMIT_NPROC is bypassable
    # via nested user namespaces (fresh per-userns fork counter), so the
    # cgroup pids limit is the reliable bound. 4096 leaves headroom above
    # the in-jail 64-process caps at agent-executor default concurrency (8 x 64 = 512).
    pids_limit: 4096
    networks:
      - core
      - core-db
      - temporal
    # For nsjail, use docker-compose.sandbox.yml with this file.
    # The overlay supplies the required privileges and cgroup bootstrap.
    environment:
      # Common
      LOG_LEVEL: ${LOG_LEVEL}
      AUTOSECOPS__LOG_FORMAT: ${AUTOSECOPS__LOG_FORMAT:-console}
      AUTOSECOPS__PLATFORM_OTEL_ENABLED: ${AUTOSECOPS__PLATFORM_OTEL_ENABLED:-false}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://localhost:4318}
      OTEL_TRACES_SAMPLER: ${OTEL_TRACES_SAMPLER:-parentbased_traceidratio}
      OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG:-1.0}
      AUTOSECOPS__APP_ENV: production
