# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
default_language_version:
  python: python3.12
default_install_hook_types: [pre-commit, commit-msg]
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        args:
          - --maxkb=3000
      - id: check-toml
      - id: check-yaml
        args:
          - --unsafe
        exclude: ^deployments/helm/.*/templates/
      # Synced skill files, vendored API docs assets and the RoboDR control-plane
      # and fleet contract vectors stay byte-identical to upstream (just
      # skill-library check; test_api_docs.py, test_robodr_control_plane_vectors.py
      # and test_robot_edr_fleet_vectors.py pin the hashes).
      - id: end-of-file-fixer
        exclude: ^(autosecops/(agent/skill/library/skills|api/static/docs)|tests/data/robodr_control_plane_v2|tests/data/robot_edr/fleet_vectors)/
      - id: trailing-whitespace
        exclude: (\.patch$|^(autosecops/(agent/skill/library/skills|api/static/docs)|tests/data/robodr_control_plane_v2|tests/data/robot_edr/fleet_vectors)/)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.7
    hooks:
      - id: ruff-check
        args:
          - --fix
          - --show-fixes
          - --verbose
      - id: ruff-format
        verbose: true
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.25.1
    hooks:
      - id: gitleaks
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.13.4
    hooks:
      # Keep uv.lock in sync with changes to pyproject.toml
      - id: uv-lock
  - repo: local
    hooks:
      - id: gen-client
        name: update frontend client
        entry: bash -c "pnpm -C frontend generate-client-ci && pnpm -C frontend check"
        language: system
        files: ^(autosecops|packages)
        require_serial: true
        pass_filenames: false
      - id: basedpyright
        name: python type check
        entry: uv run basedpyright --warnings --threads 4
        language: system
        types: [python]
        pass_filenames: false
        require_serial: true
      - id: biome-check
        name: frontend biome check
        entry: bash -c "pnpm -C frontend check"
        language: system
        files: ^frontend/
        pass_filenames: false
        require_serial: true
      - id: typecheck-frontend
        name: frontend type check
        entry: bash -c "pnpm -C frontend run typecheck"
        language: system
        files: ^frontend/
        pass_filenames: false
        require_serial: true
      - id: skill-library-check
        name: skill library check
        entry: just skill-library check
        language: system
        files: ^autosecops/agent/skill/library/(skills/|sources\.toml$)
        pass_filenames: false
        require_serial: true
      - id: gen-mcp-docs
        name: generate mcp docs
        entry: just gen-mcp-docs
        language: system
        files: ^autosecops/mcp/server\.py$
        pass_filenames: false
        require_serial: true
