      # Compression (must match worker for codec compatibility)
      AUTOSECOPS__CONTEXT_COMPRESSION_ENABLED: ${AUTOSECOPS__CONTEXT_COMPRESSION_ENABLED:-false}
      AUTOSECOPS__CONTEXT_COMPRESSION_THRESHOLD_KB: ${AUTOSECOPS__CONTEXT_COMPRESSION_THRESHOLD_KB:-16}
      AUTOSECOPS__RESULT_EXTERNALIZATION_ENABLED: ${AUTOSECOPS__RESULT_EXTERNALIZATION_ENABLED:-true}
