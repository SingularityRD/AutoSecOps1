      TEMPORAL__API_KEY: ${TEMPORAL__API_KEY}
      TEMPORAL__PAYLOAD_ENCRYPTION_ENABLED: ${TEMPORAL__PAYLOAD_ENCRYPTION_ENABLED:-false}
      TEMPORAL__PAYLOAD_ENCRYPTION_KEYRING: ${TEMPORAL__PAYLOAD_ENCRYPTION_KEYRING:-}
      TEMPORAL__PAYLOAD_ENCRYPTION_KEYRING_ARN: ${TEMPORAL__PAYLOAD_ENCRYPTION_KEYRING_ARN:-}
      TEMPORAL__PAYLOAD_ENCRYPTION_CACHE_TTL_SECONDS: ${TEMPORAL__PAYLOAD_ENCRYPTION_CACHE_TTL_SECONDS:-3600}
      TEMPORAL__PAYLOAD_ENCRYPTION_CACHE_MAX_ITEMS: ${TEMPORAL__PAYLOAD_ENCRYPTION_CACHE_MAX_ITEMS:-128}
      # Local registry
      AUTOSECOPS__LOCAL_REPOSITORY_PATH: ${AUTOSECOPS__LOCAL_REPOSITORY_PATH}
      AUTOSECOPS__LOCAL_REPOSITORY_ENABLED: ${AUTOSECOPS__LOCAL_REPOSITORY_ENABLED:-false}
      # Sentry
      SENTRY_DSN: ${SENTRY_DSN:-}
      # Redis
      REDIS_URL: ${REDIS_URL}
      # Blob storage (MinIO/S3)
      AUTOSECOPS__BLOB_STORAGE_ENDPOINT: ${AUTOSECOPS__BLOB_STORAGE_ENDPOINT:-http://minio:9000}
      AUTOSECOPS__BLOB_STORAGE_SSL_VERIFY: ${AUTOSECOPS__BLOB_STORAGE_SSL_VERIFY:-true}
