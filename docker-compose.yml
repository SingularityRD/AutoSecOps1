      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
      AUTOSECOPS__API_ROOT_PATH: ${AUTOSECOPS__API_ROOT_PATH}
      AUTOSECOPS__API_URL: ${AUTOSECOPS__API_URL}
      AUTOSECOPS__APP_ENV: production
      AUTOSECOPS__AWS_ASSUME_ROLE_ACCOUNT_ID: ${AUTOSECOPS__AWS_ASSUME_ROLE_ACCOUNT_ID:-}
