services:
  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    ports:
      - ${PUBLIC_APP_PORT}:${PUBLIC_APP_PORT}
    environment:
      - BASE_DOMAIN=${BASE_DOMAIN}
      - ADDRESS=${ADDRESS}
      - AUTOSECOPS__TRUSTED_PROXY_CIDRS=${AUTOSECOPS__TRUSTED_PROXY_CIDRS:-127.0.0.1/32}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    restart: unless-stopped
    ports:
      - ${API_PORT:-8000}:8000
    environment:
      # App
      AUTOSECOPS__AUDIT_TRUSTED_PROXY_CIDRS: ${AUTOSECOPS__AUDIT_TRUSTED_PROXY_CIDRS:-}
      AUTOSECOPS__PLATFORM_ADMIN_IP_ALLOWLIST_BYPASS: ${AUTOSECOPS__PLATFORM_ADMIN_IP_ALLOWLIST_BYPASS:-false}
      LOG_LEVEL: ${LOG_LEVEL}
      AUTOSECOPS__LOG_FORMAT: ${AUTOSECOPS__LOG_FORMAT:-console}
      AUTOSECOPS__PLATFORM_OTEL_ENABLED: ${AUTOSECOPS__PLATFORM_OTEL_ENABLED:-false}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://localhost:4318}
      OTEL_TRACES_SAMPLER: ${OTEL_TRACES_SAMPLER:-parentbased_traceidratio}
      OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG:-1.0}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
      AUTOSECOPS__ALLOW_ORIGINS: ${AUTOSECOPS__ALLOW_ORIGINS}
      AUTOSECOPS__API_ROOT_PATH: ${AUTOSECOPS__API_ROOT_PATH}
      AUTOSECOPS__API_URL: ${AUTOSECOPS__API_URL}
      AUTOSECOPS__APP_ENV: ${AUTOSECOPS__APP_ENV}
      AUTOSECOPS__AWS_ASSUME_ROLE_ACCOUNT_ID: ${AUTOSECOPS__AWS_ASSUME_ROLE_ACCOUNT_ID:-}
      AUTOSECOPS__AWS_ASSUME_ROLE_PRINCIPAL_ARN: ${AUTOSECOPS__AWS_ASSUME_ROLE_PRINCIPAL_ARN:-}
      AUTOSECOPS__AUTH_ALLOWED_DOMAINS: ${AUTOSECOPS__AUTH_ALLOWED_DOMAINS}
      AUTOSECOPS__AUTH_MIN_PASSWORD_LENGTH: ${AUTOSECOPS__AUTH_MIN_PASSWORD_LENGTH}
      AUTOSECOPS__AUTH_TYPES: ${AUTOSECOPS__AUTH_TYPES}
      AUTOSECOPS__AUTH_SUPERADMIN_EMAIL: ${AUTOSECOPS__AUTH_SUPERADMIN_EMAIL}
      AUTOSECOPS__DEV_COOKIE_NAME: ${AUTOSECOPS__DEV_COOKIE_NAME:-}
      AUTOSECOPS__DB_ENCRYPTION_KEY: ${AUTOSECOPS__DB_ENCRYPTION_KEY} # Sensitive
      AUTOSECOPS__DB_SSLMODE: ${AUTOSECOPS__DB_SSLMODE}
      AUTOSECOPS__DB_URI: ${AUTOSECOPS__DB_URI} # Sensitive
      AUTOSECOPS__PUBLIC_API_URL: ${AUTOSECOPS__PUBLIC_API_URL}
      AUTOSECOPS__PUBLIC_APP_URL: ${AUTOSECOPS__PUBLIC_APP_URL}
      AUTOSECOPS__SMTP_HOST: ${AUTOSECOPS__SMTP_HOST:-}
      AUTOSECOPS__SMTP_PORT: ${AUTOSECOPS__SMTP_PORT:-587}
      AUTOSECOPS__SMTP_USER: ${AUTOSECOPS__SMTP_USER:-}
      AUTOSECOPS__SMTP_PASSWORD: ${AUTOSECOPS__SMTP_PASSWORD:-} # Sensitive
      AUTOSECOPS__EMAIL_FROM: ${AUTOSECOPS__EMAIL_FROM:-}
      AUTOSECOPS__SERVICE_KEY: ${AUTOSECOPS__SERVICE_KEY} # Sensitive
      AUTOSECOPS__SERVICE_NAME: api
      SENTRY_DSN: ${SENTRY_DSN:-}
      AUTOSECOPS__AGENT_SANDBOX_TIMEOUT: ${AUTOSECOPS__AGENT_SANDBOX_TIMEOUT:-10800}
      AUTOSECOPS__DB_POOL_TIMEOUT: ${AUTOSECOPS__DB_POOL_TIMEOUT:-30}
      AUTOSECOPS__DB_AUTH_POOL_SIZE: ${AUTOSECOPS__DB_AUTH_POOL_SIZE:-5}
      AUTOSECOPS__DB_AUTH_MAX_OVERFLOW: ${AUTOSECOPS__DB_AUTH_MAX_OVERFLOW:-5}
      AUTOSECOPS__SIGNING_SECRET: ${AUTOSECOPS__SIGNING_SECRET} # Sensitive
      OAUTH_CLIENT_ID: ${OAUTH_CLIENT_ID}
      OAUTH_CLIENT_SECRET: ${OAUTH_CLIENT_SECRET}
      OIDC_ISSUER: ${OIDC_ISSUER}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET}
      OIDC_SCOPES: ${OIDC_SCOPES}
      USER_AUTH_SECRET: ${USER_AUTH_SECRET}
      AUTOSECOPS__FEATURE_FLAGS: ${AUTOSECOPS__FEATURE_FLAGS}
      AUTOSECOPS__LICENSE_KEY: ${AUTOSECOPS__LICENSE_KEY:-}
      AUTOSECOPS__EE_MULTI_TENANT: ${AUTOSECOPS__EE_MULTI_TENANT:-false}
      AUTOSECOPS__LITELLM_BASE_URL: ${AUTOSECOPS__LITELLM_BASE_URL:-http://litellm:4000}
      AUTOSECOPS__OUTBOUND_ALLOWED_PRIVATE_CIDRS: ${AUTOSECOPS__OUTBOUND_ALLOWED_PRIVATE_CIDRS:-}
      AUTOSECOPS__OUTBOUND_PROXY_URL: ${AUTOSECOPS__OUTBOUND_PROXY_URL:-} # Sensitive
      AUTOSECOPS__OUTBOUND_NO_PROXY: ${AUTOSECOPS__OUTBOUND_NO_PROXY:-}
      AUTOSECOPS__CONTEXT_COMPRESSION_ENABLED: ${AUTOSECOPS__CONTEXT_COMPRESSION_ENABLED:-false}
      AUTOSECOPS__CONTEXT_COMPRESSION_THRESHOLD_KB: ${AUTOSECOPS__CONTEXT_COMPRESSION_THRESHOLD_KB:-16}
      AUTOSECOPS__RESULT_EXTERNALIZATION_ENABLED: ${AUTOSECOPS__RESULT_EXTERNALIZATION_ENABLED:-true}
      AUTOSECOPS__COLLECTION_MANIFESTS_ENABLED: ${AUTOSECOPS__COLLECTION_MANIFESTS_ENABLED:-true}
      AUTOSECOPS__RESULT_EXTERNALIZATION_THRESHOLD_BYTES: ${AUTOSECOPS__RESULT_EXTERNALIZATION_THRESHOLD_BYTES}
      AUTOSECOPS__UNSAFE_DISABLE_SECRET_ERROR_WITHHOLDING: ${AUTOSECOPS__UNSAFE_DISABLE_SECRET_ERROR_WITHHOLDING:-false}
      # SAML SSO
      SAML_IDP_METADATA_URL: ${SAML_IDP_METADATA_URL}
      # Temporal
      TEMPORAL__CLUSTER_URL: ${TEMPORAL__CLUSTER_URL}
      TEMPORAL__CLUSTER_QUEUE: ${TEMPORAL__CLUSTER_QUEUE}
      TEMPORAL__CLUSTER_NAMESPACE: ${TEMPORAL__CLUSTER_NAMESPACE}
      TEMPORAL__API_KEY: ${TEMPORAL__API_KEY}
      TEMPORAL__PAYLOAD_ENCRYPTION_ENABLED: ${TEMPORAL__PAYLOAD_ENCRYPTION_ENABLED:-false}
      TEMPORAL__PAYLOAD_ENCRYPTION_KEYRING: ${TEMPORAL__PAYLOAD_ENCRYPTION_KEYRING:-}
      TEMPORAL__PAYLOAD_ENCRYPTION_KEYRING_ARN: ${TEMPORAL__PAYLOAD_ENCRYPTION_KEYRING_ARN:-}
      TEMPORAL__PAYLOAD_ENCRYPTION_CACHE_TTL_SECONDS: ${TEMPORAL__PAYLOAD_ENCRYPTION_CACHE_TTL_SECONDS:-3600}
      TEMPORAL__PAYLOAD_ENCRYPTION_CACHE_MAX_ITEMS: ${TEMPORAL__PAYLOAD_ENCRYPTION_CACHE_MAX_ITEMS:-128}
      # Blob Storage
      AUTOSECOPS__BLOB_STORAGE_ENDPOINT: ${AUTOSECOPS__BLOB_STORAGE_ENDPOINT:-http://minio:9000}
      AUTOSECOPS__BLOB_STORAGE_SSL_VERIFY: ${AUTOSECOPS__BLOB_STORAGE_SSL_VERIFY:-true}
      AUTOSECOPS__BLOB_STORAGE_PRESIGNED_URL_ENDPOINT: ${AUTOSECOPS__BLOB_STORAGE_PRESIGNED_URL_ENDPOINT:-${AUTOSECOPS__PUBLIC_APP_URL}/s3}
      AUTOSECOPS__WORKFLOW_ARTIFACT_RETENTION_DAYS: ${AUTOSECOPS__WORKFLOW_ARTIFACT_RETENTION_DAYS:-30}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      # Local registry
      AUTOSECOPS__LOCAL_REPOSITORY_PATH: ${AUTOSECOPS__LOCAL_REPOSITORY_PATH}
      AUTOSECOPS__LOCAL_REPOSITORY_ENABLED: ${AUTOSECOPS__LOCAL_REPOSITORY_ENABLED:-false}
      # Redis
      REDIS_URL: ${REDIS_URL}

    volumes:
      - ./autosecops:/app/autosecops
      - ./packages:/app/packages
      - ./alembic:/app/alembic
      - ${AUTOSECOPS__LOCAL_REPOSITORY_PATH}:/app/local_registry
    depends_on:
      migrations:
        condition: service_completed_successfully
      temporal:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:$${PORT:-8000}/health"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    restart: unless-stopped
    environment:
      LOG_LEVEL: ${LOG_LEVEL}
      AUTOSECOPS__LOG_FORMAT: ${AUTOSECOPS__LOG_FORMAT:-console}
      AUTOSECOPS__PLATFORM_OTEL_ENABLED: ${AUTOSECOPS__PLATFORM_OTEL_ENABLED:-false}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://localhost:4318}
      OTEL_TRACES_SAMPLER: ${OTEL_TRACES_SAMPLER:-parentbased_traceidratio}
      OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG:-1.0}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
      AUTOSECOPS__API_ROOT_PATH: ${AUTOSECOPS__API_ROOT_PATH}
      AUTOSECOPS__API_URL: ${AUTOSECOPS__API_URL}
      AUTOSECOPS__APP_ENV: ${AUTOSECOPS__APP_ENV}
      AUTOSECOPS__AWS_ASSUME_ROLE_ACCOUNT_ID: ${AUTOSECOPS__AWS_ASSUME_ROLE_ACCOUNT_ID:-}
      AUTOSECOPS__AWS_ASSUME_ROLE_PRINCIPAL_ARN: ${AUTOSECOPS__AWS_ASSUME_ROLE_PRINCIPAL_ARN:-}
      AUTOSECOPS__DB_ENCRYPTION_KEY: ${AUTOSECOPS__DB_ENCRYPTION_KEY} # Sensitive
      AUTOSECOPS__DB_SSLMODE: ${AUTOSECOPS__DB_SSLMODE}
      AUTOSECOPS__DB_URI: ${AUTOSECOPS__DB_URI} # Sensitive
      AUTOSECOPS__PUBLIC_API_URL: ${AUTOSECOPS__PUBLIC_API_URL}
      AUTOSECOPS__PUBLIC_APP_URL: ${AUTOSECOPS__PUBLIC_APP_URL}
      AUTOSECOPS__SERVICE_KEY: ${AUTOSECOPS__SERVICE_KEY} # Sensitive
      AUTOSECOPS__SERVICE_NAME: worker
      AUTOSECOPS__AGENT_SANDBOX_TIMEOUT: ${AUTOSECOPS__AGENT_SANDBOX_TIMEOUT:-10800}
      AUTOSECOPS__DB_POOL_TIMEOUT: ${AUTOSECOPS__DB_POOL_TIMEOUT:-30}
      AUTOSECOPS__DB_AUTH_POOL_SIZE: ${AUTOSECOPS__DB_AUTH_POOL_SIZE:-5}
      AUTOSECOPS__DB_AUTH_MAX_OVERFLOW: ${AUTOSECOPS__DB_AUTH_MAX_OVERFLOW:-5}
      AUTOSECOPS__SIGNING_SECRET: ${AUTOSECOPS__SIGNING_SECRET} # Sensitive
      AUTOSECOPS__FEATURE_FLAGS: ${AUTOSECOPS__FEATURE_FLAGS}
      AUTOSECOPS__LICENSE_KEY: ${AUTOSECOPS__LICENSE_KEY:-}
      AUTOSECOPS__EE_MULTI_TENANT: ${AUTOSECOPS__EE_MULTI_TENANT:-false}
      AUTOSECOPS__CONTEXT_COMPRESSION_ENABLED: ${AUTOSECOPS__CONTEXT_COMPRESSION_ENABLED:-false}
      AUTOSECOPS__CONTEXT_COMPRESSION_THRESHOLD_KB: ${AUTOSECOPS__CONTEXT_COMPRESSION_THRESHOLD_KB:-16}
      AUTOSECOPS__RESULT_EXTERNALIZATION_ENABLED: ${AUTOSECOPS__RESULT_EXTERNALIZATION_ENABLED:-true}
      AUTOSECOPS__COLLECTION_MANIFESTS_ENABLED: ${AUTOSECOPS__COLLECTION_MANIFESTS_ENABLED:-true}
      AUTOSECOPS__RESULT_EXTERNALIZATION_THRESHOLD_BYTES: ${AUTOSECOPS__RESULT_EXTERNALIZATION_THRESHOLD_BYTES}
      AUTOSECOPS__UNSAFE_DISABLE_SECRET_ERROR_WITHHOLDING: ${AUTOSECOPS__UNSAFE_DISABLE_SECRET_ERROR_WITHHOLDING:-false}
      # Temporal
      TEMPORAL__CLUSTER_URL: ${TEMPORAL__CLUSTER_URL}
      TEMPORAL__CLUSTER_QUEUE: ${TEMPORAL__CLUSTER_QUEUE}
      TEMPORAL__CLUSTER_NAMESPACE: ${TEMPORAL__CLUSTER_NAMESPACE}
      TEMPORAL__API_KEY: ${TEMPORAL__API_KEY}
      TEMPORAL__PAYLOAD_ENCRYPTION_ENABLED: ${TEMPORAL__PAYLOAD_ENCRYPTION_ENABLED:-false}
      TEMPORAL__PAYLOAD_ENCRYPTION_KEYRING: ${TEMPORAL__PAYLOAD_ENCRYPTION_KEYRING:-}
      TEMPORAL__PAYLOAD_ENCRYPTION_KEYRING_ARN: ${TEMPORAL__PAYLOAD_ENCRYPTION_KEYRING_ARN:-}
      TEMPORAL__PAYLOAD_ENCRYPTION_CACHE_TTL_SECONDS: ${TEMPORAL__PAYLOAD_ENCRYPTION_CACHE_TTL_SECONDS:-3600}
      TEMPORAL__PAYLOAD_ENCRYPTION_CACHE_MAX_ITEMS: ${TEMPORAL__PAYLOAD_ENCRYPTION_CACHE_MAX_ITEMS:-128}
      # Worker concurrency tuning
      TEMPORAL__THREADPOOL_MAX_WORKERS: ${TEMPORAL__THREADPOOL_MAX_WORKERS:-100}
      TEMPORAL__MAX_CONCURRENT_ACTIVITIES: ${TEMPORAL__MAX_CONCURRENT_ACTIVITIES:-100}
      TEMPORAL__MAX_CONCURRENT_WORKFLOW_TASKS: ${TEMPORAL__MAX_CONCURRENT_WORKFLOW_TASKS:-100}
      # Local registry
      AUTOSECOPS__LOCAL_REPOSITORY_PATH: ${AUTOSECOPS__LOCAL_REPOSITORY_PATH}
      AUTOSECOPS__LOCAL_REPOSITORY_ENABLED: ${AUTOSECOPS__LOCAL_REPOSITORY_ENABLED:-false}
      AUTOSECOPS__EXECUTOR_CLIENT_TIMEOUT: ${AUTOSECOPS__EXECUTOR_CLIENT_TIMEOUT:-300}
      # Sentry
      SENTRY_DSN: ${SENTRY_DSN:-}
      # Redis
      REDIS_URL: ${REDIS_URL}
      # Blob storage (for S3)
      AUTOSECOPS__BLOB_STORAGE_ENDPOINT: ${AUTOSECOPS__BLOB_STORAGE_ENDPOINT:-http://minio:9000}
      AUTOSECOPS__BLOB_STORAGE_SSL_VERIFY: ${AUTOSECOPS__BLOB_STORAGE_SSL_VERIFY:-true}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - ./autosecops:/app/autosecops
      - ./packages:/app/packages
    command: ["python", "-m", "autosecops.dsl.worker"]
    depends_on:
      migrations:
        condition: service_completed_successfully
      api:
        condition: service_started
      temporal:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  executor:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    restart: unless-stopped
    # Layer docker-compose.sandbox.yml when nsjail or SquashFS mount privileges
    # are needed locally.
    environment:
      # Common
      LOG_LEVEL: ${LOG_LEVEL}
      AUTOSECOPS__LOG_FORMAT: ${AUTOSECOPS__LOG_FORMAT:-console}
      AUTOSECOPS__PLATFORM_OTEL_ENABLED: ${AUTOSECOPS__PLATFORM_OTEL_ENABLED:-false}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://localhost:4318}
      OTEL_TRACES_SAMPLER: ${OTEL_TRACES_SAMPLER:-parentbased_traceidratio}
      OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG:-1.0}
      AUTOSECOPS__APP_ENV: ${AUTOSECOPS__APP_ENV}
      AUTOSECOPS__AWS_ASSUME_ROLE_ACCOUNT_ID: ${AUTOSECOPS__AWS_ASSUME_ROLE_ACCOUNT_ID:-}
      AUTOSECOPS__AWS_ASSUME_ROLE_PRINCIPAL_ARN: ${AUTOSECOPS__AWS_ASSUME_ROLE_PRINCIPAL_ARN:-}
      AUTOSECOPS__DB_ENCRYPTION_KEY: ${AUTOSECOPS__DB_ENCRYPTION_KEY} # Sensitive
      AUTOSECOPS__DB_SSLMODE: ${AUTOSECOPS__DB_SSLMODE}
      AUTOSECOPS__DB_URI: ${AUTOSECOPS__DB_URI} # Sensitive
      AUTOSECOPS__SERVICE_KEY: ${AUTOSECOPS__SERVICE_KEY} # Sensitive
      AUTOSECOPS__SERVICE_NAME: executor
      AUTOSECOPS__AGENT_SANDBOX_TIMEOUT: ${AUTOSECOPS__AGENT_SANDBOX_TIMEOUT:-10800}
      AUTOSECOPS__DB_POOL_TIMEOUT: ${AUTOSECOPS__DB_POOL_TIMEOUT:-30}
      AUTOSECOPS__DB_AUTH_POOL_SIZE: ${AUTOSECOPS__DB_AUTH_POOL_SIZE:-5}
      AUTOSECOPS__DB_AUTH_MAX_OVERFLOW: ${AUTOSECOPS__DB_AUTH_MAX_OVERFLOW:-5}
      AUTOSECOPS__SIGNING_SECRET: ${AUTOSECOPS__SIGNING_SECRET} # Sensitive
      AUTOSECOPS__FEATURE_FLAGS: ${AUTOSECOPS__FEATURE_FLAGS}
      AUTOSECOPS__LICENSE_KEY: ${AUTOSECOPS__LICENSE_KEY:-}
      AUTOSECOPS__EE_MULTI_TENANT: ${AUTOSECOPS__EE_MULTI_TENANT:-false}
      AUTOSECOPS__API_URL: ${AUTOSECOPS__API_URL:-http://api:8000}
      # Compression (must match worker for codec compatibility)
      AUTOSECOPS__CONTEXT_COMPRESSION_ENABLED: ${AUTOSECOPS__CONTEXT_COMPRESSION_ENABLED:-false}
      AUTOSECOPS__CONTEXT_COMPRESSION_THRESHOLD_KB: ${AUTOSECOPS__CONTEXT_COMPRESSION_THRESHOLD_KB:-16}
      AUTOSECOPS__RESULT_EXTERNALIZATION_ENABLED: ${AUTOSECOPS__RESULT_EXTERNALIZATION_ENABLED:-true}
      AUTOSECOPS__COLLECTION_MANIFESTS_ENABLED: ${AUTOSECOPS__COLLECTION_MANIFESTS_ENABLED:-true}
      AUTOSECOPS__RESULT_EXTERNALIZATION_THRESHOLD_BYTES: ${AUTOSECOPS__RESULT_EXTERNALIZATION_THRESHOLD_BYTES}
      # Registry
      AUTOSECOPS__EXECUTOR_REGISTRY_CACHE_MAX_ENTRIES: ${AUTOSECOPS__EXECUTOR_REGISTRY_CACHE_MAX_ENTRIES:-64}
      AUTOSECOPS__EXECUTOR_REGISTRY_CACHE_MAX_BYTES: ${AUTOSECOPS__EXECUTOR_REGISTRY_CACHE_MAX_BYTES:-10737418240}
      AUTOSECOPS__UNSAFE_DISABLE_SM_MASKING: ${AUTOSECOPS__UNSAFE_DISABLE_SM_MASKING:-false}
      AUTOSECOPS__UNSAFE_DISABLE_SECRET_ERROR_WITHHOLDING: ${AUTOSECOPS__UNSAFE_DISABLE_SECRET_ERROR_WITHHOLDING:-false}
      # Local registry
      AUTOSECOPS__LOCAL_REPOSITORY_PATH: ${AUTOSECOPS__LOCAL_REPOSITORY_PATH}
      AUTOSECOPS__LOCAL_REPOSITORY_ENABLED: ${AUTOSECOPS__LOCAL_REPOSITORY_ENABLED:-false}
      PYTHONPATH: ${PYTHONPATH:+${PYTHONPATH}:}/home/apiuser/.local:/app/local_registry
      # Sandbox
      # NOTE: *_ALLOWED_EGRESS_CIDRS gate private-network exceptions only;
      # the *_TCP_PORTS values apply to those CIDRs. Public IPv4 egress
      # remains unrestricted (any public IPv4, any port) regardless of the
      # allowed-egress CIDR settings. See autosecops/sandbox/networking.py.
      AUTOSECOPS__SANDBOX_DEFAULT_MEMORY_MB: ${AUTOSECOPS__SANDBOX_DEFAULT_MEMORY_MB:-2048}
      AUTOSECOPS__SANDBOX_ADDRESS_SPACE_MB: ${AUTOSECOPS__SANDBOX_ADDRESS_SPACE_MB:-}
      AUTOSECOPS__SANDBOX_NSJAIL_PATH: /usr/local/bin/nsjail
      AUTOSECOPS__SANDBOX_ROOTFS_PATH: /var/lib/autosecops/sandbox-rootfs
      AUTOSECOPS__SANDBOX_CACHE_DIR: /var/lib/autosecops/sandbox-cache
      AUTOSECOPS__REGISTRY_SYNC_CLONE_TIMEOUT: ${AUTOSECOPS__REGISTRY_SYNC_CLONE_TIMEOUT:-120}
      AUTOSECOPS__SANDBOX_PYPI_INDEX_URL: ${AUTOSECOPS__SANDBOX_PYPI_INDEX_URL:-}
      AUTOSECOPS__SANDBOX_PYPI_EXTRA_INDEX_URLS: ${AUTOSECOPS__SANDBOX_PYPI_EXTRA_INDEX_URLS:-}
      AUTOSECOPS__SANDBOX_INSTALL_ALLOWED_EGRESS_CIDRS: ${AUTOSECOPS__SANDBOX_INSTALL_ALLOWED_EGRESS_CIDRS:-}
      AUTOSECOPS__SANDBOX_INSTALL_ALLOWED_EGRESS_TCP_PORTS: ${AUTOSECOPS__SANDBOX_INSTALL_ALLOWED_EGRESS_TCP_PORTS:-80,443}
      AUTOSECOPS__SANDBOX_REGISTRY_ALLOWED_EGRESS_CIDRS: ${AUTOSECOPS__SANDBOX_REGISTRY_ALLOWED_EGRESS_CIDRS:-}
      AUTOSECOPS__SANDBOX_REGISTRY_ALLOWED_EGRESS_TCP_PORTS: ${AUTOSECOPS__SANDBOX_REGISTRY_ALLOWED_EGRESS_TCP_PORTS:-22}
      AUTOSECOPS__SANDBOX_SCRIPT_ALLOWED_EGRESS_CIDRS: ${AUTOSECOPS__SANDBOX_SCRIPT_ALLOWED_EGRESS_CIDRS:-}
      AUTOSECOPS__SANDBOX_SCRIPT_ALLOWED_EGRESS_TCP_PORTS: ${AUTOSECOPS__SANDBOX_SCRIPT_ALLOWED_EGRESS_TCP_PORTS:-443}
      AUTOSECOPS__SANDBOX_ACTION_ALLOWED_EGRESS_CIDRS: ${AUTOSECOPS__SANDBOX_ACTION_ALLOWED_EGRESS_CIDRS:-}
      AUTOSECOPS__SANDBOX_ACTION_ALLOWED_EGRESS_TCP_PORTS: ${AUTOSECOPS__SANDBOX_ACTION_ALLOWED_EGRESS_TCP_PORTS:-443}
      AUTOSECOPS__SANDBOX_AGENT_ALLOWED_EGRESS_CIDRS: ${AUTOSECOPS__SANDBOX_AGENT_ALLOWED_EGRESS_CIDRS:-}
      AUTOSECOPS__SANDBOX_AGENT_ALLOWED_EGRESS_TCP_PORTS: ${AUTOSECOPS__SANDBOX_AGENT_ALLOWED_EGRESS_TCP_PORTS:-443}
      AUTOSECOPS__SANDBOX_BLOCKED_EGRESS_CIDRS: ${AUTOSECOPS__SANDBOX_BLOCKED_EGRESS_CIDRS:-}
      AUTOSECOPS__SANDBOX_DNS_ALLOWED_EGRESS_CIDRS: ${AUTOSECOPS__SANDBOX_DNS_ALLOWED_EGRESS_CIDRS:-}
      AUTOSECOPS__SANDBOX_ALLOW_PUBLIC_IPV6_EGRESS: ${AUTOSECOPS__SANDBOX_ALLOW_PUBLIC_IPV6_EGRESS:-false}
      # Temporal
      TEMPORAL__CLUSTER_URL: ${TEMPORAL__CLUSTER_URL}
      TEMPORAL__CLUSTER_NAMESPACE: ${TEMPORAL__CLUSTER_NAMESPACE}
      TEMPORAL__API_KEY: ${TEMPORAL__API_KEY}
      TEMPORAL__PAYLOAD_ENCRYPTION_ENABLED: ${TEMPORAL__PAYLOAD_ENCRYPTION_ENABLED:-false}
      TEMPORAL__PAYLOAD_ENCRYPTION_KEYRING: ${TEMPORAL__PAYLOAD_ENCRYPTION_KEYRING:-}
      TEMPORAL__PAYLOAD_ENCRYPTION_KEYRING_ARN: ${TEMPORAL__PAYLOAD_ENCRYPTION_KEYRING_ARN:-}
      TEMPORAL__PAYLOAD_ENCRYPTION_CACHE_TTL_SECONDS: ${TEMPORAL__PAYLOAD_ENCRYPTION_CACHE_TTL_SECONDS:-3600}
      TEMPORAL__PAYLOAD_ENCRYPTION_CACHE_MAX_ITEMS: ${TEMPORAL__PAYLOAD_ENCRYPTION_CACHE_MAX_ITEMS:-128}
      # Executor worker configuration
      AUTOSECOPS__EXECUTOR_QUEUE: ${AUTOSECOPS__EXECUTOR_QUEUE:-shared-action-queue}
      AUTOSECOPS__EXECUTOR_BACKEND: ${AUTOSECOPS__EXECUTOR_BACKEND:-direct}
      AUTOSECOPS__EXECUTOR_MAX_CONCURRENT_ACTIVITIES: ${AUTOSECOPS__EXECUTOR_MAX_CONCURRENT_ACTIVITIES:-32}
      AUTOSECOPS__EXECUTOR_THREADPOOL_MAX_WORKERS: ${AUTOSECOPS__EXECUTOR_THREADPOOL_MAX_WORKERS:-32}
      AUTOSECOPS__EXECUTOR_FOR_EACH_MAX_CONCURRENCY: ${AUTOSECOPS__EXECUTOR_FOR_EACH_MAX_CONCURRENCY:-4}
      # Sentry
      SENTRY_DSN: ${SENTRY_DSN:-}
      # Redis
      REDIS_URL: ${REDIS_URL}
      # Blob storage (for S3/MinIO wheel access)
      AUTOSECOPS__BLOB_STORAGE_ENDPOINT: ${AUTOSECOPS__BLOB_STORAGE_ENDPOINT:-http://minio:9000}
      AUTOSECOPS__BLOB_STORAGE_SSL_VERIFY: ${AUTOSECOPS__BLOB_STORAGE_SSL_VERIFY:-true}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - ./autosecops:/app/autosecops
      - ./packages:/app/packages
      - ${AUTOSECOPS__LOCAL_REPOSITORY_PATH}:/app/local_registry
      - sandbox-cache:/var/lib/autosecops/sandbox-cache
    command: ["python", "-m", "autosecops.executor.worker"]
    depends_on:
      migrations:
        condition: service_completed_successfully
      temporal:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  agent-worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    restart: unless-stopped
    environment:
      # Common
      LOG_LEVEL: ${LOG_LEVEL}
