      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - ./autosecops:/app/autosecops
      - ./packages:/app/packages
    command: ["python", "-m", "autosecops.mcp"]
    depends_on:
      api:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
      temporal:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy

  ui:
    # image: ghcr.io/singularityrd/autosecops-ui:${AUTOSECOPS__IMAGE_TAG:-1.0.0}
    # container_name: ui
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
        NEXT_SERVER_API_URL: ${NEXT_SERVER_API_URL}
        NODE_ENV: ${NODE_ENV}
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/.next:/app/.next
      - ./frontend/node_modules:/app/node_modules
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: ${AUTOSECOPS__UI_MEMORY_LIMIT:-2g}
          cpus: "${AUTOSECOPS__UI_CPU_LIMIT:-0}"
    ports:
      - ${UI_PORT:-3000}:3000
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      NEXT_PUBLIC_APP_ENV: ${NEXT_PUBLIC_APP_ENV}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
      NEXT_SERVER_API_URL: ${NEXT_SERVER_API_URL}
      NODE_ENV: ${NODE_ENV}
      AUTOSECOPS__CSP_CONNECT_SRC_ORIGINS: ${AUTOSECOPS__CSP_CONNECT_SRC_ORIGINS:-${AUTOSECOPS__BLOB_STORAGE_PRESIGNED_URL_ENDPOINT:-${AUTOSECOPS__PUBLIC_APP_URL}/s3}}
      AUTOSECOPS__SERVICE_KEY: ${AUTOSECOPS__SERVICE_KEY}
    attach: false
    depends_on:
      - api

  postgres_db:
    image: ${AUTOSECOPS__PGVECTOR_IMAGE:-ghcr.io/singularityrd/autosecops-postgres:2}
    command: ["postgres"]
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: ${AUTOSECOPS__POSTGRES_DB_MEMORY_LIMIT:-8g}
          cpus: "${AUTOSECOPS__POSTGRES_DB_CPU_LIMIT:-0}"
    ports:
      - ${PG_PORT:-5432}:5432
    shm_size: 128mb
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: ${AUTOSECOPS__POSTGRES_USER}
      POSTGRES_PASSWORD: ${AUTOSECOPS__POSTGRES_PASSWORD}
    volumes:
      - core-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 180s

  migrations:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    restart: "no"
    logging: *default-logging
    environment:
      LOG_LEVEL: ${LOG_LEVEL}
      AUTOSECOPS__LOG_FORMAT: ${AUTOSECOPS__LOG_FORMAT:-console}
      AUTOSECOPS__DB_URI: ${AUTOSECOPS__DB_URI}
      AUTOSECOPS__DB_RUNTIME_USER: ${AUTOSECOPS__DB_RUNTIME_USER:-autosecops_app}
      AUTOSECOPS__DB_RUNTIME_PASSWORD: ${AUTOSECOPS__DB_RUNTIME_PASSWORD:-} # Sensitive
      AUTOSECOPS__DB_SSLMODE: ${AUTOSECOPS__DB_SSLMODE}
      AUTOSECOPS__FEATURE_FLAGS: ${AUTOSECOPS__FEATURE_FLAGS}
      AUTOSECOPS__LICENSE_KEY: ${AUTOSECOPS__LICENSE_KEY:-}
    volumes:
      - ./autosecops:/app/autosecops
      - ./packages:/app/packages
      - ./alembic:/app/alembic
    command: ["python3", "-m", "alembic", "upgrade", "head"]
    depends_on:
      postgres_db:
        condition: service_healthy

  temporal_postgres_db:
    image: ${TEMPORAL__POSTGRES_IMAGE:-postgres:16.14-trixie@sha256:95206741a5b214807675e14165369d05b93a9cf692223b616d07cca227e74b0b}
    # PostgreSQL cannot open a data directory written by another major version.
    # Stop with the upgrade steps instead of a bare FATAL, and leave the volume
    # untouched.
    entrypoint:
      - /bin/sh
      - -c
      - |
        data_version=$$(cat "$${PGDATA:-/var/lib/postgresql/data}/PG_VERSION" 2>/dev/null || true)
        if [ -n "$$data_version" ] && [ -n "$${PG_MAJOR:-}" ] && [ "$$data_version" != "$${PG_MAJOR%%.*}" ]; then
          echo "temporal_postgres_db: the temporal-db volume holds PostgreSQL $$data_version data, but this image runs PostgreSQL $$PG_MAJOR." >&2
          echo "Upgrade the Temporal database: https://docs.singularityrd.com/self-hosting/updating#upgrade-the-temporal-database" >&2
          echo "To keep the old version until then, set TEMPORAL__POSTGRES_IMAGE=postgres:$$data_version in .env." >&2
          exit 1
        fi
        exec docker-entrypoint.sh postgres
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: ${AUTOSECOPS__TEMPORAL_POSTGRES_DB_MEMORY_LIMIT:-4g}
          cpus: "${AUTOSECOPS__TEMPORAL_POSTGRES_DB_CPU_LIMIT:-0}"
    environment:
      POSTGRES_USER: ${TEMPORAL__POSTGRES_USER}
      POSTGRES_PASSWORD: ${TEMPORAL__POSTGRES_PASSWORD}
    volumes:
      - temporal-db:/var/lib/postgresql/data

  temporal:
    image: temporalio/auto-setup:${TEMPORAL__VERSION:-1.29.1}
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: ${AUTOSECOPS__TEMPORAL_MEMORY_LIMIT:-8g}
          cpus: "${AUTOSECOPS__TEMPORAL_CPU_LIMIT:-0}"
    ports:
      - ${TEMPORAL_PORT:-7233}:7233
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=${TEMPORAL__POSTGRES_USER}
      - POSTGRES_PWD=${TEMPORAL__POSTGRES_PASSWORD}
      - POSTGRES_SEEDS=temporal_postgres_db
      - DEFAULT_NAMESPACE_RETENTION=${TEMPORAL__DEFAULT_NAMESPACE_RETENTION:-24h}
      - LOG_LEVEL=warn
    healthcheck:
      test: ["CMD", "tctl", "--address", "temporal:7233", "cluster", "health"]
      interval: 5s
      timeout: 10s
      retries: 30
    depends_on:
      - temporal_postgres_db

    attach: false

  temporal_ui:
    image: temporalio/ui:${TEMPORAL__UI_VERSION:-2.43.3}
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: ${AUTOSECOPS__TEMPORAL_UI_MEMORY_LIMIT:-512m}
          cpus: "${AUTOSECOPS__TEMPORAL_UI_CPU_LIMIT:-0}"
    ports:
      - ${TEMPORAL_UI_PORT:-8081}:8080
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=http://localhost:${TEMPORAL_UI_PORT:-8081}
    depends_on:
      - temporal
    attach: false

  minio-init:
    image: cgr.dev/chainguard/minio:latest@sha256:6a1d0b45c8669726bba580ced0bfa4cb9fdeed1ed636dfabd81d1577beb6937b
    user: "0:0"
    entrypoint: ["chown", "-R", "65532:65532", "/data"]
    volumes:
      - minio-data:/data
    network_mode: none
    restart: "no"
    logging: *default-logging
    attach: false

  minio:
    image: cgr.dev/chainguard/minio:latest@sha256:6a1d0b45c8669726bba580ced0bfa4cb9fdeed1ed636dfabd81d1577beb6937b
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: ${AUTOSECOPS__MINIO_MEMORY_LIMIT:-2g}
          cpus: "${AUTOSECOPS__MINIO_CPU_LIMIT:-0}"
    ports:
      - ${MINIO_PORT:-9000}:9000
      - ${MINIO_CONSOLE_PORT:-9001}:9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    depends_on:
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5
    attach: false

  redis:
    image: valkey/valkey:8.1.10-alpine@sha256:081c2f5cb575efc901aa80ff9cdbd1ec6a301682fd35e1ebb4b0990a4a4a8507
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: ${AUTOSECOPS__REDIS_MEMORY_LIMIT:-2g}
          cpus: "${AUTOSECOPS__REDIS_CPU_LIMIT:-0}"
    # Host tests connect on loopback only.
    ports:
      - 127.0.0.1:${REDIS_PORT_HOST:-6379}:6379
    volumes:
      # Not redis-data: Valkey 8 cannot load data files written by Redis 7.4+.
      - valkey-data:/data
    # Development stacks require the password when .env sets one (env.sh always
    # does) and run without one for older development .env files.
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-} # Sensitive
      REDIS_MAXMEMORY: ${AUTOSECOPS__REDIS_MAXMEMORY:-}
    entrypoint:
      - /bin/sh
      - -c
      - |
        # Cap the dataset below the container memory limit so Valkey answers
        # writes with OOM errors instead of being OOM-killed (and crash-looping
        # on AOF replay). Default: 75% of the cgroup limit, leaving room for
        # the copy-on-write pages of an AOF rewrite. noeviction: dropping
        # locks or stream entries silently would corrupt state.
        maxmemory="$${REDIS_MAXMEMORY:-}"
        if [ -z "$$maxmemory" ]; then
          limit=$$(cat /sys/fs/cgroup/memory.max 2>/dev/null || cat /sys/fs/cgroup/memory/memory.limit_in_bytes 2>/dev/null || echo max)
          case "$$limit" in
            "" | max | *[!0-9]*) maxmemory=0 ;;
            *) if [ "$$limit" -lt 1125899906842624 ]; then maxmemory=$$((limit / 4 * 3)); else maxmemory=0; fi ;;
          esac
        fi
        case "$${REDIS_PASSWORD:-}" in
          change-me-*)
            echo "redis: set REDIS_PASSWORD in .env to a generated secret (./env.sh --upgrade)" >&2
            exit 1
            ;;
          "")
            echo "redis: REDIS_PASSWORD is empty, so Valkey accepts unauthenticated clients. Development only." >&2
            exec docker-entrypoint.sh --appendonly yes --maxmemory "$$maxmemory" --maxmemory-policy noeviction
            ;;
        esac
        exec docker-entrypoint.sh --appendonly yes --maxmemory "$$maxmemory" --maxmemory-policy noeviction --requirepass "$$REDIS_PASSWORD"
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" valkey-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 5
    attach: false

volumes:
  core-db:
  temporal-db:
  containers:
  minio-data:
  valkey-data:
  sandbox-cache:
