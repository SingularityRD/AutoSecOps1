      TEMPORAL__PAYLOAD_ENCRYPTION_CACHE_MAX_ITEMS: ${TEMPORAL__PAYLOAD_ENCRYPTION_CACHE_MAX_ITEMS:-128}
      # Agent worker configuration
      AUTOSECOPS__AGENT_QUEUE: ${AUTOSECOPS__AGENT_QUEUE:-shared-agent-queue}
