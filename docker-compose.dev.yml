# Every service rotates its logs so a busy or crash-looping container cannot
# fill the Docker host's disk. Override the bounds in .env. The driver must
# accept max-size and max-file (json-file or local); to use the Docker daemon's
# own log driver instead, see the docker-compose page's log rotation section.
x-logging: &default-logging
  driver: ${AUTOSECOPS__DOCKER_LOG_DRIVER:-json-file}
  options:
    max-size: ${AUTOSECOPS__DOCKER_LOG_MAX_SIZE:-50m}
    max-file: "${AUTOSECOPS__DOCKER_LOG_MAX_FILE:-5}"

services:
  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: ${AUTOSECOPS__CADDY_MEMORY_LIMIT:-256m}
          cpus: "${AUTOSECOPS__CADDY_CPU_LIMIT:-0}"
    ports:
      - ${PUBLIC_APP_PORT}:${PUBLIC_APP_PORT}
    environment:
      - BASE_DOMAIN=${BASE_DOMAIN}
      - ADDRESS=${ADDRESS}
      - AUTOSECOPS__TRUSTED_PROXY_CIDRS=${AUTOSECOPS__TRUSTED_PROXY_CIDRS:-127.0.0.1/32}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: ${AUTOSECOPS__API_MEMORY_LIMIT:-4g}
          cpus: "${AUTOSECOPS__API_CPU_LIMIT:-0}"
    ports:
      - ${API_PORT:-8000}:8000
    environment:
      # App
      AUTOSECOPS__AUDIT_TRUSTED_PROXY_CIDRS: ${AUTOSECOPS__AUDIT_TRUSTED_PROXY_CIDRS:-}
      AUTOSECOPS__PLATFORM_ADMIN_IP_ALLOWLIST_BYPASS: ${AUTOSECOPS__PLATFORM_ADMIN_IP_ALLOWLIST_BYPASS:-false}
      AUTOSECOPS__PLATFORM_ADMIN_MFA_BYPASS: ${AUTOSECOPS__PLATFORM_ADMIN_MFA_BYPASS:-false}
      LOG_LEVEL: ${LOG_LEVEL}
      AUTOSECOPS__LOG_FORMAT: ${AUTOSECOPS__LOG_FORMAT:-console}
      AUTOSECOPS__PLATFORM_OTEL_ENABLED: ${AUTOSECOPS__PLATFORM_OTEL_ENABLED:-false}
      # Opt-in Prometheus metrics on an internal port; never publish it.
      AUTOSECOPS__API_METRICS_ENABLED: ${AUTOSECOPS__API_METRICS_ENABLED:-false}
      AUTOSECOPS__API_METRICS_PORT: ${AUTOSECOPS__API_METRICS_PORT:-9100}
      AUTOSECOPS__API_METRICS_HOST: ${AUTOSECOPS__API_METRICS_HOST:-0.0.0.0}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://localhost:4318}
      OTEL_TRACES_SAMPLER: ${OTEL_TRACES_SAMPLER:-parentbased_traceidratio}
      OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG:-1.0}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
      AUTOSECOPS__ALLOW_ORIGINS: ${AUTOSECOPS__ALLOW_ORIGINS}
      AUTOSECOPS__API_ROOT_PATH: ${AUTOSECOPS__API_ROOT_PATH}
      AUTOSECOPS__API_URL: ${AUTOSECOPS__API_URL}
      AUTOSECOPS__APP_ENV: ${AUTOSECOPS__APP_ENV}
      AUTOSECOPS__AWS_ASSUME_ROLE_ACCOUNT_ID: ${AUTOSECOPS__AWS_ASSUME_ROLE_ACCOUNT_ID:-}
      AUTOSECOPS__AWS_ASSUME_ROLE_PRINCIPAL_ARN: ${AUTOSECOPS__AWS_ASSUME_ROLE_PRINCIPAL_ARN:-}
      AUTOSECOPS__AUTH_ALLOWED_DOMAINS: ${AUTOSECOPS__AUTH_ALLOWED_DOMAINS}
