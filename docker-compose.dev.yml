      migrations:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:$${AUTOSECOPS__LITELLM_PORT:-4000}/health/readiness"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

