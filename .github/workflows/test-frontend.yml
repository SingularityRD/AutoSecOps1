name: Frontend Tests

on:
  pull_request:
    paths:
      - frontend/**
      - .github/workflows/test-frontend.yml
  push:
    branches:
      - main
    paths:
      - frontend/**
      - .github/workflows/test-frontend.yml

permissions:
  contents: read

jobs:
  frontend-quality-and-tests:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 9
          run_install: false

      - name: Get pnpm store directory
        working-directory: frontend
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - name: Setup pnpm cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-${{ runner.arch }}-pnpm-store-${{ hashFiles('frontend/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-pnpm-store-

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Run Biome linting and formatting
        working-directory: frontend
        run: pnpm check

      - name: Run TypeScript type check
        working-directory: frontend
        run: pnpm run typecheck

      - name: Run frontend tests
        working-directory: frontend
        run: pnpm test

      - name: Summary
        if: success()
        run: |
          echo "✅ Frontend CI pipeline completed successfully!"
          echo "📝 Steps completed:"
          echo "  - Code linting and formatting (Biome)"
          echo "  - TypeScript type checking"
          echo "  - Jest test suite execution"
          echo ""
          echo "🎉 All frontend quality checks passed!"
