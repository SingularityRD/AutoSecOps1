name: Security scan

# Dependency audits and secret scanning. Every job is read-only and runs
# without secrets, so fork PRs get the same checks.
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main", "staging"]
  schedule:
    # Weekly, so advisories published after merge still surface.
    - cron: "17 5 * * 1"

permissions:
  contents: read

concurrency:
  group: security-scan-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # Scanner images are pinned by digest.
  GITLEAKS_IMAGE: zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f

jobs:
  python-dependencies:
    name: Python dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.4"

      - name: Export locked runtime dependencies
        # Workspace packages are local source, not published distributions.
        run: |
          uv export --frozen --format requirements-txt --no-dev --all-extras \
            --no-emit-workspace -o "$RUNNER_TEMP/requirements.txt"

      - name: Audit with pip-audit
        run: |
          uvx --from pip-audit==2.9.0 pip-audit \
            --requirement "$RUNNER_TEMP/requirements.txt" \
            --disable-pip --require-hashes --progress-spinner off \
            --desc on --format markdown --output "$RUNNER_TEMP/pip-audit.md" \
            || status=$?
          cat "$RUNNER_TEMP/pip-audit.md" >> "$GITHUB_STEP_SUMMARY"
          exit "${status:-0}"

  node-dependencies:
    name: Frontend dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4
        with:
          version: 10
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Audit production dependencies
        working-directory: frontend
        # Fails on high and critical advisories in shipped dependencies.
        run: pnpm audit --prod --audit-level high

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Scan with gitleaks
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          args=(--config .gitleaks.toml --redact --no-banner --exit-code 1)
          if [ "$EVENT_NAME" = "pull_request" ]; then
            # Only the commits this PR adds; both SHAs come from the event.
            for sha in "$BASE_SHA" "$HEAD_SHA"; do
              [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Unexpected SHA"; exit 1; }
            done
            mode=(git --log-opts="${BASE_SHA}..${HEAD_SHA}")
          else
            mode=(dir)
          fi
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/repo:ro" -w /repo \
            -e GIT_CONFIG_COUNT=1 \
            -e GIT_CONFIG_KEY_0=safe.directory \
            -e GIT_CONFIG_VALUE_0=/repo \
            "$GITLEAKS_IMAGE" "${mode[@]}" "${args[@]}" .
