name: Lint python

on:
  push:
    branches: [ "main" ]
    paths:
      - autosecops/**
      - packages/**
      - scripts/**
      - alembic/**
      - tests/**
      - pyproject.toml
      - uv.lock
      - .github/workflows/lint-python.yml
  pull_request:
    branches: [ "main", "staging" ]
    paths:
      - autosecops/**
      - packages/**
      - scripts/**
      - alembic/**
      - tests/**
      - pyproject.toml
      - uv.lock
      - .github/workflows/lint-python.yml

permissions:
  contents: read

jobs:
  ruff:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
        with:
          src: "autosecops/ tests/ packages/ alembic/ scripts/"
          version-file: "pyproject.toml"
          args: check --no-fix

      - uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
        with:
          src: "autosecops/ tests/ packages/ alembic/ scripts/"
          version-file: "pyproject.toml"
          args: format --diff

  pyright:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.4"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Install dependencies
        run: uv sync --no-install-project --group lint --group admin

      - name: Run basedpyright
        run: uv run --no-sync basedpyright --warnings --threads 4
