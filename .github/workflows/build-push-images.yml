name: Publish images

on:
  push:
    branches: ["staging", "preview"]
    tags:
      - "*.*.*"
      - "nightly-*"
  schedule:
    - cron: "0 0 * * 1"  # Weekly, Mondays at midnight UTC
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (for example: 1.2.3 or nightly-20250101)"
        required: true
        type: string

env:
  REGISTRY: ghcr.io

permissions:
  contents: read

concurrency:
  group: publish-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    if: >-
      github.event_name != 'workflow_dispatch' ||
      github.actor == 'github-actions[bot]' ||
      contains(
        fromJSON(vars.TRUSTED_CI_ACTORS_JSON || '[]'),
        github.triggering_actor || github.actor
      )
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      latest: ${{ steps.release.outputs.latest }}
    steps:
      - name: Validate image tag
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          tag=''
          latest=false
          release=false
          if [[ "$EVENT_NAME" == 'workflow_dispatch' ]]; then
            # Manual rebuilds must use the existing tag as their checkout ref.
            if [[ "$REF_TYPE" != 'tag' || "$INPUT_TAG" != "$REF_NAME" ]]; then
              echo 'Dispatch from the matching tag ref, with tag set to that tag.' >&2
              exit 1
            fi
            tag="$INPUT_TAG"
          elif [[ "$EVENT_NAME" == 'push' && "$REF_TYPE" == 'tag' ]]; then
            tag="$REF_NAME"
          fi

          if [[ -n "$tag" ]]; then
            stable='(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)'
            if [[ "$tag" =~ ^${stable}$ ]]; then
              latest=true
              release=true
            elif [[ "$tag" =~ ^${stable}-[0-9A-Za-z][0-9A-Za-z.-]*$ ]]; then
              release=true
            elif ! [[ "$tag" =~ ^nightly-[0-9A-Za-z][0-9A-Za-z.-]*$ ]]; then
              echo "Unsupported image tag: $tag" >&2
              exit 1
            fi
            if (( ${#tag} > 128 )); then
              echo 'Image tags must be at most 128 characters.' >&2
              exit 1
            fi
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"

      # Release images must not trust the development license key.
      - name: Checkout repository
        if: steps.release.outputs.release == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Check license public key
        if: steps.release.outputs.release == 'true'
        run: python3 scripts/check_license_public_key.py

  build-and-push-api:
    timeout-minutes: 60
    needs: validate
    permissions:
      contents: read
      packages: write
    if: >-
      github.event_name != 'workflow_dispatch' ||
      github.actor == 'github-actions[bot]' ||
      contains(
        fromJSON(vars.TRUSTED_CI_ACTORS_JSON || '[]'),
        github.triggering_actor || github.actor
      )
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
            platform_tag: linux-amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            platform_tag: linux-arm64
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false

      - name: Log in to Container registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/singularityrd/autosecops
          flavor: latest=false
          # Override the labels the action derives from the repository, whose
          # name and license metadata do not describe the shipped product.
          labels: |
            org.opencontainers.image.title=AutoSecOps
            org.opencontainers.image.description=AutoSecOps API, workers, executor, and agent runtime
            org.opencontainers.image.vendor=SingularityRD
            org.opencontainers.image.licenses=LicenseRef-Proprietary
          tags: |
            type=sha
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=nightly-{{date 'YYYYMMDD'}}-{{sha}},enable=${{ github.event_name == 'schedule' }}
            type=match,pattern=nightly-(.*),group=0
            type=raw,value=${{ needs.validate.outputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' }}

      # GitHub-hosted runners start empty, so layers are cached in the GitHub
      # Actions cache, scoped per image and platform.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: production
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          # SPDX SBOM and SLSA provenance, attached to the image index as
          # attestation manifests and covered by the cosign signature below.
          sbom: true
          provenance: mode=max
          outputs: type=image,name=ghcr.io/singularityrd/autosecops,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=api-${{ matrix.platform_tag }}
          cache-to: type=gha,mode=max,scope=api-${{ matrix.platform_tag }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-${{ matrix.platform_tag }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge-api:
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    if: >-
      github.event_name != 'workflow_dispatch' ||
      github.actor == 'github-actions[bot]' ||
      contains(
        fromJSON(vars.TRUSTED_CI_ACTORS_JSON || '[]'),
        github.triggering_actor || github.actor
      )
    needs: [validate, build-and-push-api]
    runs-on: ubuntu-24.04
    outputs:
      digest: ${{ steps.digest.outputs.digest }}
    steps:
      - name: Download digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to Container registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/singularityrd/autosecops
          flavor: latest=false
          # Override the labels the action derives from the repository, whose
          # name and license metadata do not describe the shipped product.
          labels: |
            org.opencontainers.image.title=AutoSecOps
            org.opencontainers.image.description=AutoSecOps API, workers, executor, and agent runtime
            org.opencontainers.image.vendor=SingularityRD
            org.opencontainers.image.licenses=LicenseRef-Proprietary
          tags: |
            type=sha
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=nightly-{{date 'YYYYMMDD'}}-{{sha}},enable=${{ github.event_name == 'schedule' }}
            type=match,pattern=nightly-(.*),group=0
            type=raw,value=${{ needs.validate.outputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          args=()
          while IFS= read -r tag; do
            args+=(-t "$tag")
          done < <(jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          for digest in *; do
            args+=("ghcr.io/singularityrd/autosecops@sha256:$digest")
          done
          docker buildx imagetools create "${args[@]}"

      - name: Inspect image
        id: digest
        env:
          IMAGE: ghcr.io/singularityrd/autosecops:${{ steps.meta.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          docker buildx imagetools inspect "$IMAGE"
          digest=$(docker buildx imagetools inspect "$IMAGE" --format '{{json .Manifest}}' | jq -r .digest)
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "Unexpected digest: $digest" >&2; exit 1; }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

  build-and-push-tunnel-gateway:
    timeout-minutes: 30
    needs: validate
    permissions:
      contents: read
      packages: write
    if: >-
      github.event_name != 'workflow_dispatch' ||
      github.actor == 'github-actions[bot]' ||
      contains(
        fromJSON(vars.TRUSTED_CI_ACTORS_JSON || '[]'),
        github.triggering_actor || github.actor
      )
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
            platform_tag: linux-amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            platform_tag: linux-arm64
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false

      - name: Log in to Container registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/singularityrd/autosecops-tunnel-gateway
          flavor: latest=false
          # Override the labels the action derives from the repository, whose
          # name and license metadata do not describe the shipped product.
          labels: |
            org.opencontainers.image.title=AutoSecOps tunnel gateway
            org.opencontainers.image.description=AutoSecOps managed tunnel gateway
            org.opencontainers.image.vendor=SingularityRD
            org.opencontainers.image.licenses=LicenseRef-Proprietary
          tags: |
            type=sha
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=nightly-{{date 'YYYYMMDD'}}-{{sha}},enable=${{ github.event_name == 'schedule' }}
            type=match,pattern=nightly-(.*),group=0
            type=raw,value=${{ needs.validate.outputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' }}

      # GitHub-hosted runners start empty, so layers are cached in the GitHub
      # Actions cache, scoped per image and platform.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.tunnel-gateway
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max
          outputs: type=image,name=ghcr.io/singularityrd/autosecops-tunnel-gateway,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=tunnel-gateway-${{ matrix.platform_tag }}
          cache-to: type=gha,mode=max,scope=tunnel-gateway-${{ matrix.platform_tag }}

      - name: Export digest
        run: |
          mkdir -p /tmp/tunnel-gateway-digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/tunnel-gateway-digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tunnel-gateway-digests-${{ matrix.platform_tag }}
          path: /tmp/tunnel-gateway-digests/*
          if-no-files-found: error
          retention-days: 1

  merge-tunnel-gateway:
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    if: >-
      github.event_name != 'workflow_dispatch' ||
      github.actor == 'github-actions[bot]' ||
      contains(
        fromJSON(vars.TRUSTED_CI_ACTORS_JSON || '[]'),
        github.triggering_actor || github.actor
      )
    needs: [validate, build-and-push-tunnel-gateway]
    runs-on: ubuntu-24.04
    outputs:
      digest: ${{ steps.digest.outputs.digest }}
    steps:
      - name: Download digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: /tmp/tunnel-gateway-digests
          pattern: tunnel-gateway-digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to Container registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/singularityrd/autosecops-tunnel-gateway
          flavor: latest=false
          # Override the labels the action derives from the repository, whose
          # name and license metadata do not describe the shipped product.
          labels: |
            org.opencontainers.image.title=AutoSecOps tunnel gateway
            org.opencontainers.image.description=AutoSecOps managed tunnel gateway
            org.opencontainers.image.vendor=SingularityRD
            org.opencontainers.image.licenses=LicenseRef-Proprietary
          tags: |
            type=sha
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=nightly-{{date 'YYYYMMDD'}}-{{sha}},enable=${{ github.event_name == 'schedule' }}
            type=match,pattern=nightly-(.*),group=0
            type=raw,value=${{ needs.validate.outputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Create manifest list and push
        working-directory: /tmp/tunnel-gateway-digests
        run: |
          args=()
          while IFS= read -r tag; do
            args+=(-t "$tag")
          done < <(jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          for digest in *; do
            args+=("ghcr.io/singularityrd/autosecops-tunnel-gateway@sha256:$digest")
          done
          docker buildx imagetools create "${args[@]}"

      - name: Inspect image
        id: digest
        env:
          IMAGE: ghcr.io/singularityrd/autosecops-tunnel-gateway:${{ steps.meta.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          docker buildx imagetools inspect "$IMAGE"
          digest=$(docker buildx imagetools inspect "$IMAGE" --format '{{json .Manifest}}' | jq -r .digest)
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "Unexpected digest: $digest" >&2; exit 1; }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

  build-and-push-ui:
    needs: validate
    permissions:
      contents: read
      packages: write
    if: >-
      github.event_name != 'workflow_dispatch' ||
      github.actor == 'github-actions[bot]' ||
      contains(
        fromJSON(vars.TRUSTED_CI_ACTORS_JSON || '[]'),
        github.triggering_actor || github.actor
      )
    # The Next.js bundle is platform independent, so one amd64 runner compiles
    # it once (see frontend/Dockerfile.prod) and only the small runner stage is
    # built per platform. arm64 runner-stage steps run under QEMU.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false

      # Register arm64 emulation before the builder starts its buildkitd.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64

      - name: Log in to Container registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/singularityrd/autosecops-ui
          flavor: latest=false
          # Override the labels the action derives from the repository, whose
          # name and license metadata do not describe the shipped product.
          labels: |
            org.opencontainers.image.title=AutoSecOps UI
            org.opencontainers.image.description=AutoSecOps web UI
            org.opencontainers.image.vendor=SingularityRD
            org.opencontainers.image.licenses=LicenseRef-Proprietary
          tags: |
            type=sha
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=nightly-{{date 'YYYYMMDD'}}-{{sha}},enable=${{ github.event_name == 'schedule' }}
            type=match,pattern=nightly-(.*),group=0
            type=raw,value=${{ needs.validate.outputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' }}

      # GitHub-hosted runners start empty, so layers are cached in the GitHub
      # Actions cache. One multi-platform build shares a single scope.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          platforms: linux/amd64,linux/arm64

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
          NEXT_PUBLIC_APP_ENV: production
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          NEXT_SERVER_API_URL: http://localhost:8000
          NODE_ENV: production
        with:
          context: frontend
          file: frontend/Dockerfile.prod
          platforms: linux/amd64,linux/arm64
          build-args: |
            NEXT_PUBLIC_API_URL=${{ env.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_APP_ENV=${{ env.NEXT_PUBLIC_APP_ENV }}
            NEXT_PUBLIC_APP_URL=${{ env.NEXT_PUBLIC_APP_URL }}
            NEXT_SERVER_API_URL=${{ env.NEXT_SERVER_API_URL }}
            NODE_ENV=${{ env.NODE_ENV }}
          labels: ${{ steps.meta.outputs.labels }}
          tags: ${{ steps.meta.outputs.tags }}
          sbom: true
          provenance: mode=max
          push: true
          cache-from: type=gha,scope=ui-multiarch
          cache-to: type=gha,mode=max,scope=ui-multiarch

  # Keyless cosign signatures through GitHub OIDC (Fulcio certificate, Rekor
  # transparency log entry). Each signature covers the multi-platform index,
  # which references the per-platform images and their SBOM and provenance
  # attestations by digest. Verify with:
  #   cosign verify ghcr.io/singularityrd/<image>@<digest> \
  #     --certificate-oidc-issuer https://token.actions.githubusercontent.com \
  #     --certificate-identity-regexp '^https://github\.com/SingularityRD/AutoSecOps1/\.github/workflows/build-push-images\.yml@'
  sign-images:
    needs: [merge-api, build-and-push-ui, merge-tunnel-gateway]
    # Keyless signing records the repository and digest in the public Rekor
    # log, so it only runs once the IMAGE_SIGNING_ENABLED variable opts in.
    if: vars.IMAGE_SIGNING_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write # push signatures next to the images in ghcr.io
      id-token: write # request the OIDC token cosign exchanges for a signing certificate
    steps:
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6

      - name: Log in to Container registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Sign image indexes
        env:
          API_DIGEST: ${{ needs.merge-api.outputs.digest }}
          UI_DIGEST: ${{ needs.build-and-push-ui.outputs.digest }}
          GATEWAY_DIGEST: ${{ needs.merge-tunnel-gateway.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          refs=(
            "ghcr.io/singularityrd/autosecops@${API_DIGEST}"
            "ghcr.io/singularityrd/autosecops-ui@${UI_DIGEST}"
            "ghcr.io/singularityrd/autosecops-tunnel-gateway@${GATEWAY_DIGEST}"
          )
          for ref in "${refs[@]}"; do
            if ! [[ "$ref" =~ @sha256:[0-9a-f]{64}$ ]]; then
              echo "Refusing to sign a reference without a digest: $ref" >&2
              exit 1
            fi
          done
          for ref in "${refs[@]}"; do
            cosign sign --yes "$ref"
            echo "- \`$ref\`" >> "$GITHUB_STEP_SUMMARY"
          done

  promote-latest:
    needs: [validate, merge-api, build-and-push-ui, merge-tunnel-gateway, sign-images]
    # sign-images may be skipped when signing is disabled; promote only when
    # nothing upstream failed or was cancelled.
    if: ${{ !failure() && !cancelled() && needs.validate.outputs.latest == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    # Hold one lock across both updates, including releases from other trains.
    concurrency:
      group: publish-images-latest
      queue: max
      cancel-in-progress: false
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to Container registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `latest` only ever moves forward. A hotfix on an older train (1.1.5
      # after 1.2.0) publishes its own tag but leaves `latest` alone, so
      # anyone pulling `latest` is never downgraded. The newest stable git
      # tag is the reference: release tags are pushed before their images
      # build, so a newer release in flight also holds `latest` back.
      - name: Refuse to move latest backwards
        id: forward
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          VERSION: ${{ needs.validate.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          stable='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          if ! [[ "$VERSION" =~ $stable ]]; then
            echo "::error::Only stable versions can become latest, not '${VERSION}'."
            exit 1
          fi
          tags=$(gh api --paginate "repos/${REPO}/git/matching-refs/tags/" \
            --jq '.[].ref | ltrimstr("refs/tags/")')
          newest=$(printf '%s\n' "$tags" | grep -E "$stable" \
            | sort -t. -k1,1n -k2,2n -k3,3n | tail -n 1 || true)
          if [[ -z "$newest" ]]; then
            echo "::error::No stable release tag found; cannot tell whether ${VERSION} is the newest."
            exit 1
          fi
          if [[ "$newest" == "$VERSION" ]]; then
            echo "promote=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::${VERSION} is older than ${newest}; latest stays where it is."
            echo "promote=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Promote both stable manifests to latest
        if: steps.forward.outputs.promote == 'true'
        env:
          VERSION: ${{ needs.validate.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          for image in autosecops autosecops-ui autosecops-tunnel-gateway; do
            docker buildx imagetools create \
              --tag "ghcr.io/singularityrd/$image:latest" \
              "ghcr.io/singularityrd/$image:$VERSION"
          done
