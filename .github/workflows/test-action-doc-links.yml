name: Test action documentation links

on:
  schedule:
    # Runs weekly, Mondays at 10:17 UTC.
    - cron: "17 10 * * 1"

permissions:
  contents: read

concurrency:
  group: test-action-doc-links-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-action-doc-links:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.4"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            packages/*/pyproject.toml
            uv.lock
          cache-suffix: action-doc-links

      - name: Install dependencies
        run: uv sync --frozen

      - name: Check action documentation links
        env:
          AUTOSECOPS_TEST_ACTION_DOC_LINKS: "1"
        run: uv run --no-sync pytest scripts/tests/test_action_doc_links.py -ra
