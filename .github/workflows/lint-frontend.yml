name: Frontend code quality

on:
  push:
    branches: ["main"]
    paths:
      - frontend/**
      - autosecops/**
      - packages/**
      - pyproject.toml
      - uv.lock
      - .github/workflows/lint-frontend.yml
  pull_request:
    branches: ["main", "staging"]
    paths:
      - frontend/**
      - autosecops/**
      - packages/**
      - pyproject.toml
      - uv.lock
      - .github/workflows/lint-frontend.yml

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.4"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Install Python dependencies
        run: uv sync --no-install-project

      - name: Setup Biome
        uses: biomejs/setup-biome@4c91541eaada48f67d7dbd7833600ce162b68f51 # v2
        with:
          working-dir: frontend/
          version: 2.0.4

      - name: Run Biome
        working-directory: frontend
        run: biome ci .

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 9
          run_install: false

      - name: Get pnpm store directory
        working-directory: frontend
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - name: Setup pnpm cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-${{ runner.arch }}-pnpm-store-${{ hashFiles('frontend/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-pnpm-store-

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Check frontend client is up to date
        run: |
          pnpm -C frontend generate-client-ci
          # openapi-ts output style doesn't match repo formatting; normalize generated client only
          pnpm -C frontend exec biome check --write src/client
          git diff --exit-code frontend/src/client/

      - name: Run TypeScript type check
        working-directory: frontend
        run: pnpm run typecheck
