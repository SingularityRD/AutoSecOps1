name: Frontend Smoke

# Runs the Playwright smoke suite (sign-in, workspace, workflow builder,
# credentials, members, license status) against a full local stack built from
# the checked-out commit.
#
# The pull_request job is unprivileged: it reads no repository secrets, uses a
# read-only GITHUB_TOKEN, builds images locally (the gha cache is read-only
# here), and only talks to services it starts on the runner. That keeps it
# safe for fork PRs. Do not add secrets or write permissions to this workflow.
on:
  pull_request:
    branches: ["main"]
    paths:
      - frontend/**
      # Backend changes that shape what the UI renders or calls.
      - autosecops/**
      - packages/**
      - alembic/**
      - pyproject.toml
      - uv.lock
      # How the smoke stack is built and started.
      - Dockerfile
      - .dockerignore
      - docker-compose.local.yml
      - .github/docker-compose.integration.yml
      - Caddyfile
      - env.sh
      - .env.example
      - scripts/postgres/**
      - deployments/postgres/**
      - docker/**
      # The image bundles docs for Workspace Chat.
      - docs/**
      - .github/workflows/frontend-smoke.yml
  workflow_dispatch:
  schedule:
    # Runs at 08:00 EST, Monday through Friday.
    - cron: "0 13 * * 1-5"

permissions:
  contents: read

# A new push to the same PR supersedes the previous smoke run. Scheduled and
# manual runs each get their own group so they are never cancelled.
concurrency:
  group: >-
    frontend-smoke-${{ github.event_name == 'pull_request'
    && format('pr-{0}', github.event.pull_request.number)
    || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  frontend-smoke:
    if: >-
      github.event_name != 'workflow_dispatch' ||
      github.actor == 'github-actions[bot]' ||
      contains(
        fromJSON(vars.TRUSTED_CI_ACTORS_JSON || '[]'),
        github.triggering_actor || github.actor
      )
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.4"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10
          run_install: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Configure environment
        env:
          # CI services are throwaway and tests connect with the well-known
          # development credentials, so keep them even in production mode.
          AUTOSECOPS_DEV_CREDENTIALS: "true"
        run: |
          echo "y
          localhost
          n
          test@autosecops.example" | bash env.sh

      - name: Install dependencies
        run: |
          uv sync --locked --group dev --group admin
          pnpm --dir frontend install --frozen-lockfile
          pnpm --dir frontend exec playwright install --with-deps chromium

      - name: Build CI image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: production
          load: true
          tags: autosecops-ci:frontend-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          # Reuse the amd64 layers the nightly image publish caches on main.
          cache-from: type=gha,scope=api-linux-amd64

      - name: Build UI image
        env:
          AUTOSECOPS__CI_IMAGE_TAG: frontend-smoke-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          docker compose -f docker-compose.local.yml -f .github/docker-compose.integration.yml build ui

      # PRs test their own candidate, before its GHCR tag is published.
      - name: Build PostgreSQL candidate image
        run: bash scripts/postgres/build-image.sh

      - name: Start AutoSecOps stack
        env:
          AUTOSECOPS__CI_IMAGE_TAG: frontend-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          AUTOSECOPS__UNSAFE_DISABLE_SM_MASKING: "true"
          AUTOSECOPS__EXECUTOR_BACKEND: "direct"
          AUTOSECOPS__FEATURE_FLAGS: ""
          AUTOSECOPS__REGISTRY_SYNC_SANDBOX_ENABLED: "true"
        run: |
          set -euo pipefail

          compose_files=(-f docker-compose.local.yml -f .github/docker-compose.integration.yml)
          docker compose "${compose_files[@]}" up --no-build -d temporal api worker executor postgres_db caddy minio redis ui

          timeout 300 bash -c 'until curl -fsS http://localhost/api/health; do sleep 5; done'
          timeout 120 bash -c 'until curl -fsS http://localhost; do sleep 5; done'

          set -a
          . ./.env
          set +a

          AUTOSECOPS__DB_URI="postgresql+psycopg://postgres:postgres@localhost:5432/postgres" \
            uv run --no-sync autosecops admin create-dev-user \
              --email dev@autosecops.example \
              --password password1234 \
              --superuser-email test@autosecops.example \
              --superuser-password password1234 \
              --default-tier-entitlements custom_registry \
              --org-role organization-owner \
              --workspace-role workspace-admin

      - name: Run frontend smoke suite
        run: |
          PLAYWRIGHT_BASE_URL="http://localhost"
          export PLAYWRIGHT_BASE_URL
          pnpm --dir frontend run test:frontend-smoke

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-smoke-playwright-report
          path: frontend/playwright-report
          if-no-files-found: ignore

      - name: Upload Playwright test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-smoke-playwright-test-results
          path: frontend/test-results
          if-no-files-found: ignore

      - name: Show service logs on failure
        if: failure()
        env:
          AUTOSECOPS__CI_IMAGE_TAG: frontend-smoke-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          compose_files=(-f docker-compose.local.yml -f .github/docker-compose.integration.yml)

          echo "=== Docker Service Status ==="
          docker compose "${compose_files[@]}" ps

          echo "=== API Logs ==="
          docker compose "${compose_files[@]}" logs api --tail=200

          echo "=== UI Logs ==="
          docker compose "${compose_files[@]}" logs ui --tail=200

          echo "=== Worker Logs ==="
          docker compose "${compose_files[@]}" logs worker --tail=200

          echo "=== Executor Logs ==="
          docker compose "${compose_files[@]}" logs executor --tail=200

          echo "=== PostgreSQL Logs ==="
          docker compose "${compose_files[@]}" logs postgres_db --tail=200

      - name: Stop AutoSecOps stack
        if: always()
        env:
          AUTOSECOPS__CI_IMAGE_TAG: frontend-smoke-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          docker compose -f docker-compose.local.yml -f .github/docker-compose.integration.yml down -v
