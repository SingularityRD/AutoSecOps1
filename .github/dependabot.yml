# Dependabot version updates.
#
# Supply-chain policy: nothing newer than 7 days is proposed. This mirrors
# `exclude-newer = "7 days"` in pyproject.toml and `minimum-release-age` in
# frontend/.npmrc, so a bump Dependabot opens is one the lockfile tooling will
# also accept. Security updates (Dependabot alerts) are not subject to the
# cooldown and still open immediately.
#
# Commit messages follow .github/commit-conventions.toml: dependency bumps are
# `build(deps): ...`, and GitHub Actions bumps are a bare `ci: ...`. The scope
# is spelled into the prefix instead of `include: scope`, which would write
# `build(deps-dev): ...` for development dependencies, and `deps-dev` is not a
# scope.
#
# Version updates are minor and patch only for Python, frontend, and base
# images: every entry below except GitHub Actions ignores
# `version-update:semver-major`. Major upgrades are done as deliberate, tested
# migration PRs, not as bot bumps. These rules filter version updates only.
# Security updates are raised from Dependabot alerts, and GitHub documents
# `update-types` ignore rules as not applying to them, so a fix that needs a
# major still opens a PR. Never add an ignore rule without `update-types` or
# `versions`: ignoring a dependency outright can suppress its security updates
# too. GitHub Actions are SHA-pinned, and majors there are reviewed in the
# grouped PR, so that entry has no ignore rule.
#
# Base images are pinned as `name:tag@sha256:<digest>` in every Dockerfile.
# Dependabot refreshes the digest and patch-level tags so OS security patches
# still reach the images. A tag that changes the runtime (Python 3.12 to 3.13,
# uv 0.13 to 0.14, or any major) is ignored and needs its own migration PR.
version: 2

updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:17"
      timezone: Etc/UTC
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    commit-message:
      prefix: build(deps)
    ignore:
      # Majors move in a deliberate, tested migration PR (see the header).
      - dependency-name: "*"
        update-types: [version-update:semver-major]
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      time: "05:17"
      timezone: Etc/UTC
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    commit-message:
      prefix: build(deps)
    ignore:
      # Majors move in a deliberate, tested migration PR (see the header).
      - dependency-name: "*"
        update-types: [version-update:semver-major]
      # Held until their migration PRs land. openapi-ts 0.99 rewrites the
      # generated client, biome 2.6 needs a config migration and the
      # lint-frontend.yml pin moved with it, and react-virtual 3.14 changes
      # viewport sizing and scrollToIndex (tool picker keyboard paging).
      # Remove each entry in the PR that migrates it.
      - dependency-name: "@hey-api/openapi-ts"
        update-types: [version-update:semver-minor, version-update:semver-patch]
      - dependency-name: "@biomejs/*"
        update-types: [version-update:semver-minor, version-update:semver-patch]
      - dependency-name: "@tanstack/react-virtual"
        update-types: [version-update:semver-minor, version-update:semver-patch]
    groups:
      frontend-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directories:
      - /
      - /frontend
      - /.devcontainer
    schedule:
      interval: weekly
      day: monday
      time: "05:17"
      timezone: Etc/UTC
    cooldown:
      default-days: 7
    commit-message:
      prefix: build(deps)
    ignore:
      # A major base-image move (for example Node 22 to 24) changes the
      # runtime and needs a deliberate, tested migration PR instead.
      - dependency-name: "*"
        update-types: [version-update:semver-major]
      # Python's minor version is the interpreter (3.12 to 3.13), and uv is
      # 0.x, so its minor bumps can change resolution. Both must match
      # requires-python and the uv version CI pins, so they move deliberately.
      - dependency-name: "python"
        update-types: [version-update:semver-minor]
      - dependency-name: "ghcr.io/astral-sh/uv"
        update-types: [version-update:semver-minor]
    groups:
      base-images:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:17"
      timezone: Etc/UTC
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
    groups:
      github-actions:
        patterns: ["*"]
